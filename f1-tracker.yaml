    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_display, sorting_weight: 6}
  - platform: template        # 6.14.1 / decision 77: keyed on driverId, never the car number
    id: watched_driver        # M2: options are GENERATED from the compiled driver
    name: Watched Driver      # table - ESPHome select options are compile-time (M0-1)
    icon: mdi:account-star
    options: ["Max Verstappen", "Lando Norris", "Charles Leclerc", "Oscar Piastri",
              "George Russell", "Lewis Hamilton", "Fernando Alonso", "(none)"]
    initial_option: "Max Verstappen"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_race, sorting_weight: 1}
    on_value: [script.execute: apply_settings]
  - platform: template        # 8.2: tint both rows and show the constructors'
    id: favourite_team        # position. ESPHome select options are compile-time
    name: Favourite Team      # (decision 109), so this list is the current grid.
    icon: mdi:shield-star
    options: ["(none)", "Red Bull Racing", "McLaren", "Ferrari", "Mercedes",
              "Aston Martin", "Alpine", "Williams", "Racing Bulls", "Audi",
              "Haas F1 Team", "Cadillac"]
    initial_option: "(none)"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_race, sorting_weight: 9}
