# F1 Tracker - Guition ESP32-4848S040 (REQUIREMENTS.md rev 8)
# Third board after sky-tracker (installed) and plane-tracker. Same panel, same
# UI cues. Files: f1-tracker.yaml plus C++ headers in f1-tracker/.
# M0 scope: hardware, platform tuning, entities, page shells. No data layer yet.

substitutions:
  fw_version: "1.0.17"         # bump on every install; shown in HA, settings and the status page
  name: f1-tracker
  friendly_name: F1 Tracker
  # UI-44: the ONLY use of a position is computing sunrise/sunset for auto-dim
  # (decision 7). Nothing on screen is plotted from it.
  obs_lat: "61.581"
  obs_lon: "-149.439"
  tracker_common_url: https://github.com/akcoder/tracker-common
  tracker_common_ref: v0.4.6     # a tag, so a change in tracker-common cannot break this build
  tracker_common_refresh: 1d
  manifest_url: https://akcoder.github.io/f1-tracker/manifest.json   # UI-68: built and published by the Firmware workflow
  # The board package's tunables (tracker-common/boards/guition-4848s040.yaml):
  tcp_window: "65535"         # NET-15 (decision 99): every response the device makes fits ONE window
  tcp_mbox: "64"              # >= window / MSS = 65535/1440 = 46 (decision 101)
  tcp_sack: "y"               # a lost segment costs more behind a 64 KB window
  http_timeout: 20s
  timezone: America/Anchorage
  ap_name: "F1 Tracker"       # NET-2: the open fallback AP, renamed with the MAC suffix at boot
  carousel_default: "45"      # UI-20: seconds per card (brief asked 30 s - 1 min)

# The firmware-update card and the web page's icon and logo link are shared with
# sky-tracker: github.com/akcoder/tracker-common (a local build can point at a checkout,
# see dev/f1-tracker-dev.yaml).
external_components:
  - source:
      type: git
      url: ${tracker_common_url}
      ref: ${tracker_common_ref}
    components: [tracker_common]
    refresh: ${tracker_common_refresh}
tracker_common:

esp32:                        # merged into the board package's block
  framework:
    sdkconfig_options:
      # Decision 203: internal RAM. This project's big tables go to PSRAM (f1_mem.h), and so
      # does the Bluetooth host's working memory. On the first board the controller could not
      # allocate its advertisement ("BLE_INIT: Malloc failed"), and neither the fallback AP
      # nor a station join would complete, with ~57 kB of our own tables in internal RAM.
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: y
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: y
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: y

packages:
  tracker_common_pkg:         # the fonts, the board and the diagnostics every tracker shares (decision 194)
    url: ${tracker_common_url}
    ref: ${tracker_common_ref}
    files: [fonts.yaml, boards/guition-4848s040.yaml, boards/guition-4848s040-sdkconfig.yaml, boards/ble-improv.yaml, boards/backlight.yaml, diagnostics.yaml]
    refresh: ${tracker_common_refresh}

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: dan.f1_tracker
    version: "${fw_version}"
  build_flags:
    # PERF-8: LVGL tracks 32 dirty areas by default and redraws the WHOLE screen
    # when they overflow. Our risk is not moving markers (nothing here moves
    # per-frame) but a 22-row order page plus flags, bars, clock and banner
    # comfortably exceeding 32 regions during a race weekend.
    - "-DLV_INV_BUF_SIZE=128"
    # Decision 116 again, from the other side. ESPHome compiles an LVGL widget
    # type in only when one appears in the YAML, so lv_image_create does not
    # link. The trace lines ARE declared in YAML because there are exactly
    # three of them; the 22 order-row flags cannot be, because C++ creates them
    # (UI-10a). Where the widget count is fixed, declare it; where widgets are
    # built dynamically, enable the type here.
    - "-DLV_USE_IMAGE=1"
    # The dinosaur's walk (tracker_dino.h) draws over a snapshot of the screen, as sky-tracker's and
    # plane-tracker's animations do.
    - "-DLV_USE_SNAPSHOT=1"
  includes:
    - f1-tracker/f1_logo.h         # generated: tools/gen_logo.py
    - f1-tracker/f1_circuits.h     # generated: tools/gen_circuits.py
    - f1-tracker/f1_calendar.h     # generated: tools/gen_calendar.py
    - f1-tracker/f1_flags.h        # generated: tools/gen_flags.py
    - f1-tracker/f1_drivers.h      # generated: tools/gen_drivers.py
    - f1-tracker/f1_legends.h      # generated: tools/gen_drivers.py
    - f1-tracker/f1_portraits.h    # generated: tools/gen_portraits.py
    - f1-tracker/f1_facts.h        # generated: tools/gen_facts.py
    - f1-tracker/f1_birthday.h
    - f1-tracker/f1_champ.h
    - f1-tracker/f1_team.h
    - f1-tracker/f1_roster.h
    - f1-tracker/f1_boot.h
    - f1-tracker/f1_cars.h         # generated: tools/gen_cars.py
    - f1-tracker/f1_logomark.h     # generated: tools/gen_logo.py, the logo outline the cars follow
    - f1-tracker/f1_animlogic.h
    - f1-tracker/f1_tz.h          # the time zone picker (decision 205)
    - f1-tracker/f1_critterlogic.h
    - f1-tracker/f1_critterbite.h  # a hungry visit's plan: where the bites are and when
    - f1-tracker/f1_wound.h        # what Carl's bite looks like (MOTION-8)
    - f1-tracker/f1_faces.h        # where the face is in each portrait
    - f1-tracker/f1_dinologic.h
    - f1-tracker/f1_dino_data.h
    - f1-tracker/f1_critter.h     # the shared engine of the two below
    - f1-tracker/f1_dino.h        # the walking dinosaur (decision 203)
    - f1-tracker/f1_toucanlogic.h
    - f1-tracker/f1_toucan_data.h
    - f1-tracker/f1_toucan.h      # the toucan's visit (decision 204)
    - f1-tracker/f1_carl_data.h
    - f1-tracker/f1_carl.h        # Carl, who bites a face (MOTION-8)
    - f1-tracker/f1_anim.h         # animated logos: start lights and a car lapping the circuit
    - f1-tracker/f1_map.h
    - f1-tracker/f1_state.h
    - f1-tracker/f1_mem.h          # PSRAM_BSS: the big tables live in PSRAM (decision 203)
    - f1-tracker/f1_watch.h
    - f1-tracker/f1_json.h
    - f1-tracker/f1_store.h
    - f1-tracker/f1_order.h
    - f1-tracker/f1_photo.h        # a portrait decoding in the background, redrawn as rows arrive
    - f1-tracker/f1_detail.h
    - f1-tracker/f1_headshot.h     # runtime headshots for drivers with no compiled portrait
    - f1-tracker/f1_net.h
    - f1-tracker/f1_app.h
    - f1-tracker/f1_carousel.h
    - f1-tracker/f1_ui.h
  on_boot:
    - priority: 1100           # HW-7: before the SPI bus (1000) and the panel init
      then:
        - lambda: |-
            tracker::panel_soft_reset(39, 48, 47);   // CS, SCK, MOSI of GUITION-4848S040
            // NET-2: fallback AP named "F1 Tracker - XXXX" (last MAC bytes).
            // Must be set before WiFi starts (250); ESPHome's ssid: is a literal.
            uint8_t mac[6];
            get_mac_address_raw(mac);
            char ssid[33];
            snprintf(ssid, sizeof(ssid), "F1 Tracker - %02X%02X", mac[4], mac[5]);
            auto ap = id(wifi_comp).get_ap();
            ap.set_ssid(ssid);
            id(wifi_comp).set_ap(ap);
    - priority: -200           # UI-68: the first update check, once the boot fetches are
      then:                    # done - at boot a third TLS session beside the two the
        - delay: 3min          # data task keeps ran out of memory on sky-tracker
        - lambda: |-
            if (id(wifi_comp).is_connected()) tracker::upd::check_quiet("boot");
    - priority: 600            # NET-10: before web_server's own setup (249), so
      then:                    # our handler for "/" is asked first
        - lambda: |-
            tracker::web::install({f1::logo::FAVICON_SVG, f1::logo::HEADER_SVG,
                                   (size_t) f1::logo::HEADER_SVG_LEN,
                                   "https://github.com/akcoder/f1-tracker", "F1 Tracker ${fw_version}"});
    - priority: -100           # widgets exist by now (7.1.2: entities own the
      then:                    # values, the widgets are one view of them)
        - lambda: |-
            // BOOT-2: the boot screen (logo, "Loading") on the panel BEFORE the slow
            // start-up below. LVGL draws nothing on its own until setup ends, so one
            // frame is forced now; and the light writes its restored level only from
            // loop(), after setup, so the backlight is set here too - without it the
            // panel stays dark until setup is over.
            lv_refr_now(nullptr);
            {
              float b = 0.0f;
              id(backlight).current_values_as_brightness(&b);   // the restored level, gamma applied
              id(backlight_pwm).set_level(b);
            }
        - lambda: |-
            f1::ui::Widgets w;
            w.map_box = id(card_map);
            w.line    = id(trace_line)->obj;
            w.tick    = id(trace_tick)->obj;
            w.north   = id(trace_north)->obj;
            w.race_box   = id(map_box);               // the race page's map (decision 202)
            w.race_line  = id(race_line)->obj;
            w.race_tick  = id(race_tick)->obj;
            w.race_north = id(race_north)->obj;
            w.north_n      = id(trace_north_n);
            w.race_north_n = id(race_north_n);
            w.badge   = id(card_badge);
            w.photo   = id(card_photo);
            w.flag    = id(card_flag);
            w.credit  = id(card_credit);
            w.title   = id(card_title);
            w.body    = id(card_body);
            w.font_small = id(mono12)->get_lv_font();
            f1::ui::setup(w, id(carousel_secs).state, id(carousel_content).active_index().value_or(0));
            f1::order::setup(id(order_rows), id(order_hdr), id(mono12)->get_lv_font(),
                             [](int i) { f1::app::open_driver(i); });
            f1::app::Widgets aw;
            aw.race_title  = id(race_title);
            aw.race_state  = id(race_state);
            aw.race_sub    = id(race_sub);
            aw.race_clock  = id(race_clock);
            aw.order_title = id(order_title);
            aw.standings   = id(standings_body);
            aw.summary      = id(summary_body);
            aw.summary_skip = &id(summary_page)->skip;   // decision 202: hidden from the page order until it has something
            aw.order_skip   = &id(order_page)->skip;     // likewise while the entry list is empty
            aw.constructors = id(constructors_body);
            aw.champ_line   = id(champ_line);
            aw.progress     = id(progress);
            aw.race_flag   = id(race_flag);
            aw.top5        = id(top5);
            aw.race_facts  = id(race_facts);
            aw.banner      = id(watch_banner);
            aw.banner_text = id(watch_text);
            aw.banner_flag = id(watch_flag);
            f1::app::setup(aw);
            f1::ui::enable_swipe(id(circuit_page)->obj, id(card_map));   // UI-20c: swipe left = next card, right = back
            f1::detail::setup(id(detail_panel), id(detail_title), id(detail_body),
                              id(detail_flag), id(detail_photo), id(detail_credit));
            tracker::upd::set_source("${manifest_url}");
            tracker::upd::init(id(fw_update), id(setup_title)->get_lv_font(), id(mono16)->get_lv_font(),
                          id(mono12)->get_lv_font(), &lv_font_montserrat_28);   // UI-68
            tracker::display::factor_now = [] {      // the Backlight number needs it
              const auto t = id(sntp_time).now();
              return t.is_valid() ? tracker::display::auto_factor((double) t.timestamp, (double) id(obs_lat).state,
                                                                  (double) id(obs_lon).state, true) : 1.0f;
            };
            f1::dino::C::bubble_font = id(mono16)->get_lv_font();         // MOTION-5
            f1::dino::C::enabled = [] { return id(dino_on).state; };
            f1::tz::init();                                             // UI-70: the zone picker
            f1::toucan::C::bubble_font = id(mono16)->get_lv_font();        // MOTION-6
            f1::toucan::C::enabled = [] { return id(toucan_on).state; };
            f1::dino::C::food_hook = f1::toucan::C::food_hook = f1::carl::C::food_hook = f1::ui::food;   // MOTION-7: what a hungry visit can eat
            f1::carl::C::bubble_font = id(mono16)->get_lv_font();          // MOTION-8
            f1::carl::C::enabled = [] { return id(carl_on).state; };
            tracker::upd::ota_hook_begin = [] { f1::net::ota_begin(); };   // 2.4.6: pause the data task
            tracker::upd::ota_hook_error = [] { f1::net::ota_error(); };   // resume it if the install failed
            f1::anim::init(id(wifi_page)->obj, id(boot_mark), id(about_page)->obj, id(about_mark));
            f1::net::start();                 // the data task, pinned to core 1
            lv_label_set_text(id(wifi_title), "Connecting to Wi-Fi");   // BOOT-2: start-up done
            ESP_LOGI("mem", "internal %u kB free (largest block %u kB), PSRAM %u kB free",   // decision 203
                     (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024,
                     (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024,
                     (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024);
        - lambda: |-
            // NET-25: a restored number is range-checked at boot, not trusted - ESPHome
            // restores the stored bytes without clamping to min/max, and a NaN or a
            // "95" from an older build would otherwise be read as it is.
            auto clamp = [](number::Number *n, float lo, float hi, float dflt) {
              const float v = n->state;
              const float c = std::isnan(v) ? dflt : (v < lo ? lo : (v > hi ? hi : v));
              if (std::isnan(v) || c != v) n->make_call().set_value(c).perform();
            };
            clamp(id(obs_lat), -90, 90, ${obs_lat});
            clamp(id(obs_lon), -180, 180, ${obs_lon});
            clamp(id(carousel_secs), 15, 120, ${carousel_default});
        - script.execute: apply_settings   # UI-181: the restored settings, once, now that the UI exists

# UI-181 / 7.1.2: ONE apply-settings handler. The panel's Save, the web UI and Home
# Assistant all change the ENTITIES; each entity's trigger below lands here, and so
# does boot. Validation stays at Save and at boot (UI-182, NET-25).
script:
  - id: screen_sleep           # UI-62: the shield is shown while asleep and swallows the waking touch
    then:
      - lambda: |-
          id(screen_asleep) = true;
          id(bright_before_sleep) = std::max(0.01f, id(backlight).current_values.get_brightness());
          lv_obj_remove_flag(id(wake_shield), LV_OBJ_FLAG_HIDDEN);
      - light.turn_off:
          id: backlight
          transition_length: 1s
  - id: screen_wake
    then:
      - lambda: |-
          id(screen_asleep) = false;
          id(last_touch_ms) = esphome::millis();
      - light.turn_on:
          id: backlight
          brightness: !lambda return id(bright_before_sleep);
          transition_length: 250ms
  - id: apply_settings
    then:
      - lambda: |-
          f1::app::apply_settings(id(carousel_secs).state,
                                  (int) id(carousel_content).active_index().value_or(0),
                                  id(favourite_team).current_option().c_str(),
                                  id(watched_driver).current_option().c_str(),
                                  id(watched_alerts).state, id(milestone_only).state,
                                  id(alert_style).active_index().value_or(0) == 0);

wifi:
  id: wifi_comp
  on_connect:
    - lambda: f1::net::wifi_up(true);
  on_disconnect:              # NET-8: no network calls while Wi-Fi is down
    - lambda: f1::net::wifi_up(false);

web_server:                   # the base (port, version 3, local) is in the board package
  sorting_groups:
    - id: grp_race
      name: Race
      sorting_weight: 10
    - id: grp_display
      name: Display
      sorting_weight: 20
    - id: grp_location
      name: Location
      sorting_weight: 30
    - id: grp_anim              # decision 202: every animation on demand, for looking at them
      name: Animations
      sorting_weight: 35
    - id: grp_system
      name: System
      sorting_weight: 40

# "Made for ESPHome": updates are published as a JSON manifest and fetched over
# the internet. The device checks hourly (see the interval below) and exposes an
# update entity to Home Assistant and the web UI.
update:
  - platform: http_request
    id: fw_update
    name: Firmware Update
    icon: mdi:cloud-download
    # The Firmware workflow (.github/workflows/firmware.yml, as sky-tracker's) publishes the
    # manifest with the binaries on Pages; the release notes are the release body.
    source: ${manifest_url}
    update_interval: never    # driven by our own hourly interval, so the check
                              # can also be triggered from the settings screen
    web_server: {sorting_group_id: grp_system, sorting_weight: 0}

dashboard_import:
  package_import_url: github://akcoder/f1-tracker/f1-tracker.yaml@main
  import_full_config: false

image:
  # A 1x1 placeholder, purely so the LVGL image widgets have a valid src: at
  # compile time. C++ repoints them at the real flag and portrait data in flash
  # (f1_ui.h, f1_order.h) - nothing is ever copied.
  - file: reference/pixel.png
    id: pixel_img
    type: RGB565
  # The mark, made from the Monza trace in f1_circuits.h (tools/gen_logo.py).
  # Shown large on the boot screen; the web UI gets the SVG form (NET-10).
  - file: reference/logo/boot-200.png
    id: boot_logo
    type: RGB565
    resize: 200x200
  - file: reference/logo/boot-200.png     # About page: 112 px, resized when the
    id: about_logo                        # firmware is built, not scaled by LVGL
    type: RGB565
    resize: 112x112
  - file: reference/logo/f1-wordmark.png  # the F1 logo, the title's first word (tools/gen_logo.py)
    id: f1_mark
    type: RGB565

# mono12/14/16/18/24, setup_title and setup_body are the shared set: tracker-common/fonts.yaml (the
# packages entry at the top). What follows is this project's own.
font:
  - file: "gfonts://Roboto Mono"
    id: mono13                # the race page's facts: a point up from mono12 (owner, on the board)
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@300"
    id: title_big             # boot/About "Tracker": cap height matches the F1 logo (36 px)
    size: 50
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi18                 # settings-page row icons. The codepoint list is
    size: 18                  # GENERATED from MDI's own metadata by
    bpp: 4                    # tools/gen_icons.py - guessing one gives a blank
                              # glyph that compiles and only shows on a screen.
    glyphs: ["\U000F0017", "\U000F009E", "\U000F00DF", "\U000F00E1", "\U000F0150", "\U000F0156", "\U000F0162", "\U000F0193", "\U000F01E7", "\U000F023C", "\U000F0241", "\U000F02FD", "\U000F034E", "\U000F0379", "\U000F04BA", "\U000F051B", "\U000F051F", "\U000F053A", "\U000F056C", "\U000F0594", "\U000F05A8", "\U000F05A9", "\U000F061A", "\U000F0835", "\U000F0904", "\U000F0925", "\U000F0A60", "\U000F0BB1", "\U000F0F57", "\U000F0F5A", "\U000F113B", "\U000F1362"]
globals:
  - id: from_about            # set by About's Close so the settings page does NOT
    type: bool                # re-stage on return - that would discard unsaved edits and
    initial_value: "false"     # re-capture a live-changed brightness as Cancel's baseline
  - id: last_touch_ms         # UI-62: last touch or wake, for the screen-off timeout
    type: uint32_t
    initial_value: "0"
  - id: screen_asleep         # UI-62: backlight off by the after-sunset timeout
    type: bool
    initial_value: "false"
  - id: bright_before_sleep   # UI-62: level to restore on wake
    type: float
    initial_value: "0.5"

# ---------------------------------------------------------------- entities
# 7.1.2: entities are the single source of truth; LVGL widgets are one VIEW of
# them. A design where the widget owns the value cannot be driven from HA.
button:
  - platform: template        # UI-68b: the web UI / HA twin of Settings > Check for updates
    name: Upgrade Check
    icon: mdi:cloud-refresh
    entity_category: config
    web_server: {sorting_group_id: grp_system, sorting_weight: 1}
    on_press:                 # quiet: no card on the panel - the Firmware row and the
      - lambda: |-            # icon beside the gear show the result
          tracker::upd::check_quiet("button");
  - platform: restart         # decision 210: a reboot from the web UI / HA (sky-tracker's, same group)
    name: Reboot
    icon: mdi:restart
    entity_category: config
    web_server: {sorting_group_id: grp_system, sorting_weight: 5}
  # Decision 202: the animations, each on demand from the web UI (group Animations), so they
  # can be looked at without waiting for a boot, a race or the dinosaur's own timer.
  - platform: template
    name: Dinosaur walk
    icon: mdi:google-downasaur
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_anim, sorting_weight: 4}
    on_press:
      - lvgl.page.show: circuit_page
      - lambda: f1::dino::walk_now();
  - platform: template
    name: Dinosaur eats
    icon: mdi:food-drumstick
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_anim, sorting_weight: 5}
    on_press:
      - lvgl.page.show: circuit_page
      - lambda: f1::dino::eat_now();
  - platform: template        # MOTION-8: a driver's card is shown, and Carl comes for the face
    name: Carl bites
    icon: mdi:sheep
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_anim, sorting_weight: 9}
    on_press:
      - lvgl.page.show: circuit_page
      - lambda: |-
          f1::ui::show_kind(f1::carousel::DRIVER, esphome::millis());
          f1::carl::visit_now();
  - platform: template
    name: Toucan eats
    icon: mdi:food-apple
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_anim, sorting_weight: 8}
    on_press:
      - lvgl.page.show: circuit_page
      - lambda: f1::toucan::eat_now();
  - platform: template
    name: Toucan visit
    icon: mdi:bird
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_anim, sorting_weight: 7}
    on_press:
      - lvgl.page.show: circuit_page
      - lambda: f1::toucan::visit_now();
  - platform: template
    name: Alert banner
    icon: mdi:bell-ring
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_anim, sorting_weight: 5}
    on_press:
      - lvgl.page.show: race_page         # the banner lives on the race page
      - lambda: f1::app::demo_alert(false, esphome::millis());
  - platform: template
    name: Alert takeover
    icon: mdi:trophy
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_anim, sorting_weight: 6}
    on_press:
      - lvgl.page.show: race_page         # the banner lives on the race page
      - lambda: f1::app::demo_alert(true, esphome::millis());

number:
  - platform: template        # UI-44 / decision 7: feeds sunrise/sunset ONLY
    id: obs_lat
    name: Latitude
    icon: mdi:latitude
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${obs_lat}
    entity_category: config
    web_server: {sorting_group_id: grp_location, sorting_weight: 1}
  - platform: template
    id: obs_lon
    name: Longitude
    icon: mdi:longitude
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${obs_lon}
    entity_category: config
    web_server: {sorting_group_id: grp_location, sorting_weight: 2}
  - platform: template        # UI-20: brief asked 30 s - 1 min; range brackets it
    id: carousel_secs
    name: Carousel Interval
    icon: mdi:timer-outline
    min_value: 15
    max_value: 120
    step: 15
    unit_of_measurement: s
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: ${carousel_default}
    web_server: {sorting_group_id: grp_display, sorting_weight: 3}
    on_value: [script.execute: apply_settings]

switch:
  - platform: template        # UI-44c / UI-62: the panel is dark from sunset to sunrise (plane-tracker's
    id: auto_off              # rules): after sunset it goes out after a minute without a touch, and a
    name: Auto Off            # touch brings it back. Exclusive with Auto Brightness (a dark panel has
    icon: mdi:power-sleep     # nothing to dim).
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: {sorting_group_id: grp_display, sorting_weight: 7}
    on_turn_on:
      - switch.turn_off: auto_bright
    on_turn_off:
      - lambda: |-
          if (!id(screen_asleep)) return;
          id(screen_wake)->execute();
          lv_obj_add_flag(id(wake_shield), LV_OBJ_FLAG_HIDDEN);   // no touch to eat
  - id: !extend auto_bright
    on_turn_on:
      - switch.turn_off: auto_off
  - platform: template        # MOTION-5: a dinosaur walks across the screen now and then
    id: dino_on
    name: Dinosaur
    icon: mdi:google-downasaur
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_display, sorting_weight: 3}
  - platform: template        # UI-17 (sky-tracker's `24-hour Clock`, owner: not plane-tracker's three-way, no Zulu)
    id: clock_24h
    name: 24-hour Clock
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON       # this project's default stays 24 h (UI-112)
    web_server: {sorting_group_id: grp_display, sorting_weight: 2}
  - platform: template        # MOTION-8: Carl bites a driver or legend in the face, rarely
    id: carl_on
    name: Carl
    icon: mdi:sheep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_display, sorting_weight: 22}
  - platform: template        # MOTION-6: a toucan flies by now and then
    id: toucan_on
    name: Toucan
    icon: mdi:bird
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_display, sorting_weight: 21}
  - platform: template        # 6.14: ships watching Max Verstappen
    id: watched_alerts
    name: Watched Driver Alerts
    icon: mdi:bell-ring
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_race, sorting_weight: 3}
    on_turn_on: [script.execute: apply_settings]
    on_turn_off: [script.execute: apply_settings]
  - platform: template        # 6.14.3: the rare tier without the per-session one
    id: milestone_only
    name: Milestone Alerts Only
    icon: mdi:trophy-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: {sorting_group_id: grp_race, sorting_weight: 4}
    on_turn_on: [script.execute: apply_settings]
    on_turn_off: [script.execute: apply_settings]
  - platform: template
    id: show_practice
    name: Show Practice Sessions
    icon: mdi:timer-sand
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_race, sorting_weight: 5}
  - platform: template        # decision 90: a Sprint is a first-class race day
    id: show_sprint
    name: Show Sprint Sessions
    icon: mdi:flash
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_race, sorting_weight: 6}

select:
  - platform: template        # UI-70 (sky-tracker's): the clock's time zone; Auto takes Home Assistant's
    id: time_zone
    name: Time Zone
    icon: mdi:earth
    optimistic: true
    restore_value: true
    initial_option: "Alaska"      # the build's own zone (America/Anchorage)
    options:
      - "Auto (from HA)"
      - "Hawaii"
      - "Alaska"
      - "Pacific"
      - "Mountain"
      - "Arizona"
      - "Central"
      - "Eastern"
      - "Atlantic"
