            radius: 8
            bg_color: 0x1A2547
            shadow_width: 0
            widgets:
              - label: {text: "\U000F034E", align: CENTER, text_font: mdi18, text_color: 0xC9D3F2}
            on_click:
              - lambda: |-
                  lv_obj_add_flag(id(settings_kb)->obj, LV_OBJ_FLAG_HIDDEN);
                  lv_obj_t *pnl[3] = {id(pnl_display), id(pnl_race), id(pnl_location)};
                  lv_obj_t *btn[3] = {id(tab_display), id(tab_race), id(tab_location)};
                  f1::ui::settings_tab(pnl, btn, 2, id(settings_title));

        - obj:                  # 7 / UI-16a: three panels, one shown at a time
            id: pnl_display
            x: 0
            y: 104
            width: 480
            height: 250
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            radius: 0
            scrollable: false
            widgets:
              - label: {x: 16, y: 6, text: "\U000F00E1", text_font: mdi18, text_color: 0x7E8BB3}
              - label: {x: 44, y: 6, text: "Display Brightness", text_font: mono16, text_color: 0xC9D3F2}
              - dropdown:             # staged like the other fields, applied on Save
                  id: dd_bright
                  x: 250
                  y: 0
                  width: 200
                  height: 40
                  options:
                    - "Auto dim"
                    - "Auto off"
                    - "No change"
                  text_font: mono16
                  text_color: 0xEEF2FF
                  bg_color: 0x0E1836
                  border_color: 0x3A4E86
                  border_width: 2
                  pad_all: 6
                  dropdown_list:
                    text_font: mono16
                    text_color: 0xEEF2FF
                    bg_color: 0x0E1836
                    border_color: 0x3A4E86
                  indicator:
                    text_font: montserrat_14
                    text_color: 0x7E8BB3
                  on_click:
                    - lvgl.widget.hide: settings_kb
              - label: {x: 44, y: 46, text: "dims after sunset, or dark from sunset to sunrise", text_font: mono12, text_color: 0x7E8BB3}
              - label: {x: 16, y: 72, text: "\U000F00DF", text_font: mdi18, text_color: 0x7E8BB3}
              - label: {x: 44, y: 72, text: "Brightness", text_font: mono16, text_color: 0xC9D3F2}
              - slider:
                  id: sl_bright
                  x: 150
