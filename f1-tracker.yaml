# F1 Tracker - Guition ESP32-4848S040 (REQUIREMENTS.md rev 8)
# Third board after sky-tracker (installed) and plane-tracker. Same panel, same
# UI cues. Files: f1-tracker.yaml plus C++ headers in f1-tracker/.
# M0 scope: hardware, platform tuning, entities, page shells. No data layer yet.

substitutions:
  fw_version: "0.1.0"         # bump on every install; shown in HA, settings and the status page
  name: f1-tracker
  friendly_name: F1 Tracker
  # UI-44: the ONLY use of a position is computing sunrise/sunset for auto-dim
  # (decision 7). Nothing on screen is plotted from it.
  obs_lat: "61.581"
  obs_lon: "-149.439"
  backlight_min: "0.10"       # HW-6: lowest duty still visible; raise if the panel
                              # goes dark at the bottom of the brightness slider
  carousel_default: "45"      # UI-20: seconds per card (brief asked 30 s - 1 min)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: dan.f1_tracker
    version: "${fw_version}"
  build_flags:
    # PERF-8: LVGL tracks 32 dirty areas by default and redraws the WHOLE screen
    # when they overflow. Our risk is not moving markers (nothing here moves
    # per-frame) but a 22-row order page plus flags, bars, clock and banner
    # comfortably exceeding 32 regions during a race weekend.
    - "-DLV_INV_BUF_SIZE=128"
    # Decision 116 again, from the other side. ESPHome compiles an LVGL widget
    # type in only when one appears in the YAML, so lv_image_create does not
    # link. The trace lines ARE declared in YAML because there are exactly
    # three of them; the 22 order-row flags cannot be, because C++ creates them
    # (UI-10a). Where the widget count is fixed, declare it; where widgets are
    # built dynamically, enable the type here.
    - "-DLV_USE_IMAGE=1"
  includes:
    - f1-tracker/f1_panel.h
    - f1-tracker/f1_logo.h         # generated: tools/gen_logo.py
    - f1-tracker/f1_web.h
    - f1-tracker/f1_circuits.h     # generated: tools/gen_circuits.py
    - f1-tracker/f1_calendar.h     # generated: tools/gen_calendar.py
    - f1-tracker/f1_flags.h        # generated: tools/gen_flags.py
    - f1-tracker/f1_drivers.h      # generated: tools/gen_drivers.py
    - f1-tracker/f1_legends.h      # generated: tools/gen_drivers.py
    - f1-tracker/f1_portraits.h    # generated: tools/gen_portraits.py
    - f1-tracker/f1_facts.h        # generated: tools/gen_facts.py
    - f1-tracker/f1_birthday.h
    - f1-tracker/f1_display.h
    - f1-tracker/f1_champ.h
    - f1-tracker/f1_team.h
    - f1-tracker/f1_roster.h
    - f1-tracker/f1_boot.h
    - f1-tracker/f1_sun.h
    - f1-tracker/f1_updlogic.h
    - f1-tracker/f1_update.h
    - f1-tracker/f1_cars.h         # generated: tools/gen_cars.py
    - f1-tracker/f1_animlogic.h
    - f1-tracker/f1_anim.h         # animated logos: start lights and a car lapping the circuit
    - f1-tracker/f1_map.h
    - f1-tracker/f1_state.h
    - f1-tracker/f1_watch.h
    - f1-tracker/f1_json.h
    - f1-tracker/f1_store.h
    - f1-tracker/f1_order.h
    - f1-tracker/f1_jpg.h          # the portrait decoder (top-down)
    - f1-tracker/f1_photo.h        # a portrait decoding in the background, redrawn as rows arrive
    - f1-tracker/f1_detail.h
    - f1-tracker/f1_net.h
    - f1-tracker/f1_app.h
    - f1-tracker/f1_carousel.h
    - f1-tracker/f1_ui.h
  on_boot:
    - priority: 1100           # HW-7: before the SPI bus (1000) and the panel init
      then:
        - lambda: |-
            f1::panel_soft_reset(39, 48, 47);   // CS, SCK, MOSI of GUITION-4848S040
            // NET-2: fallback AP named "F1 Tracker - XXXX" (last MAC bytes).
            // Must be set before WiFi starts (250); ESPHome's ssid: is a literal.
            uint8_t mac[6];
            get_mac_address_raw(mac);
            char ssid[33];
            snprintf(ssid, sizeof(ssid), "F1 Tracker - %02X%02X", mac[4], mac[5]);
            auto ap = id(wifi_comp).get_ap();
            ap.set_ssid(ssid);
            id(wifi_comp).set_ap(ap);
    - priority: -200           # UI-68: the first update check, once the boot fetches are
      then:                    # done - at boot a third TLS session beside the two the
        - delay: 3min          # data task keeps ran out of memory on sky-tracker
        - lambda: |-
            if (id(wifi_comp).is_connected()) f1::upd::check_quiet("boot");
    - priority: 600            # NET-10: before web_server's own setup (249), so
      then:                    # our handler for "/" is asked first
        - lambda: f1::web::install();
    - priority: -100           # widgets exist by now (7.1.2: entities own the
      then:                    # values, the widgets are one view of them)
        - lambda: |-
            // BOOT-2: the boot screen (logo, "Loading") on the panel BEFORE the slow
            // start-up below. LVGL draws nothing on its own until setup ends, so one
            // frame is forced now; and the light writes its restored level only from
            // loop(), after setup, so the backlight is set here too - without it the
            // panel stays dark until setup is over.
            lv_refr_now(nullptr);
            {
              float b = 0.0f;
              id(backlight).current_values_as_brightness(&b);   // the restored level, gamma applied
              id(backlight_pwm).set_level(b);
            }
        - lambda: |-
            f1::ui::Widgets w;
            w.map_box = id(card_map);
            w.line    = id(trace_line)->obj;
            w.tick    = id(trace_tick)->obj;
            w.north   = id(trace_north)->obj;
            w.badge   = id(card_badge);
            w.photo   = id(card_photo);
            w.flag    = id(card_flag);
            w.credit  = id(card_credit);
            w.title   = id(card_title);
            w.body    = id(card_body);
            w.font_small = id(mono12)->get_lv_font();
            f1::ui::setup(w, id(carousel_secs).state, id(carousel_content).active_index().value_or(0));
            f1::order::setup(id(order_rows), id(order_hdr), id(mono12)->get_lv_font(),
                             [](int i) { f1::app::open_driver(i); });
            f1::app::Widgets aw;
            aw.race_title  = id(race_title);
            aw.race_state  = id(race_state);
            aw.race_sub    = id(race_sub);
            aw.race_clock  = id(race_clock);
            aw.order_title = id(order_title);
            aw.standings   = id(standings_body);
            aw.summary      = id(summary_body);
            aw.constructors = id(constructors_body);
            aw.champ_line   = id(champ_line);
            aw.progress     = id(progress);
            aw.race_flag   = id(race_flag);
            aw.top5        = id(top5);
            aw.race_facts  = id(race_facts);
            aw.banner      = id(watch_banner);
            aw.banner_text = id(watch_text);
            aw.banner_flag = id(watch_flag);
            f1::app::setup(aw);
            {  // 8.2: the favourite team. This TemplateSelect exposes an index
               // rather than a string, so the names live beside the options.
              static const char *const TEAMS[] = {
                  "", "Red Bull Racing", "McLaren", "Ferrari", "Mercedes",
                  "Aston Martin", "Alpine", "Williams", "Racing Bulls", "Audi",
                  "Haas F1 Team", "Cadillac"};
              const int i = (int) id(favourite_team).active_index().value_or(0);
              if (i > 0 && i < (int) (sizeof(TEAMS) / sizeof(TEAMS[0])))
                snprintf(f1::app::g.favourite.name, sizeof(f1::app::g.favourite.name),
                         "%s", TEAMS[i]);
            }
            f1::detail::setup(id(detail_panel), id(detail_title), id(detail_body),
                              id(detail_flag), id(detail_photo), id(detail_credit));
            f1::upd::set_source("https://github.com/akcoder/f1-tracker/releases/latest/download/manifest.json");
            f1::upd::init(id(fw_update), id(setup_title)->get_lv_font(), id(mono16)->get_lv_font(),
                          id(mono12)->get_lv_font(), &lv_font_montserrat_28);   // UI-68
            f1::anim::init(id(wifi_page)->obj, id(boot_mark), id(about_page)->obj, id(about_mark));
            f1::net::start();                 // the data task, pinned to core 1
            lv_label_set_text(id(wifi_title), "Connecting to Wi-Fi");   // BOOT-2: start-up done

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  # 2.4.5 / decision 6: DEFAULT partition table. No skydata-style data partition -
  # the calendar is compiled in instead (decision 12), and the default table
  # leaves larger OTA app slots, which matters because the portraits (decision 91)
  # are 25-30% of one slot. OTA cannot move partitions: settled before first flash.
  framework:
    type: esp-idf
    sdkconfig_options:
      # PERF-2: re-sync panel DMA every vblank so a stall cannot leave the picture
      # permanently shifted.
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: y
      # PERF-10: run code and rodata from PSRAM. Flash and PSRAM share one bus on
      # the S3: flash fetches starved the panel's refills (jitter) and flash writes
      # stalled the cache entirely (shift during uploads). This replaces the need
      # for CONFIG_LCD_RGB_ISR_IRAM_SAFE, which must still NOT be added (PERF-3).
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # NET-15 (decision 99): 64 KB receive window, up from sky-tracker's 32 KB.
      # Throughput is capped at window/RTT and these hosts are ~100 ms away. At
      # 32 KB our largest response (47.0 KB) needs TWO windows and stalls a full
      # round-trip mid-transfer; at 64 KB every response the device ever makes
      # fits in ONE. 48 KB worst case: 250 ms -> 75 ms.
      # 65535 is the largest UNSCALED window, so CONFIG_LWIP_WND_SCALE stays off
      # (decision 100) - going further buys 37 ms on a rare fetch.
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      # Must scale with the window: >= window/MSS = 65535/1440 = 46 (decision 101).
      # Left at 32 this throttles the larger window back to what it replaced.
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      # A lost segment costs more behind a 64 KB window than a 32 KB one.
      CONFIG_LWIP_TCP_SACK_OUT: y
      # Keep lwIP/WiFi buffers out of the ~70 kB of free internal RAM. The 64 KB
      # windows therefore come from PSRAM - capacity is nothing against 8 MB, but
      # the BANDWIDTH shares a bus with the panel (see 14.1).
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      # UI-68: all mbedTLS memory from PSRAM. The update check is a THIRD TLS
      # session beside the two the data task keeps open (NET-12), and from internal
      # RAM it did not fit: sky-tracker's check failed with "-0x7F00" (out of
      # memory) until this was set, and plain malloc (its 4.6.4) was not enough.
      # Costs handshake time on the PSRAM bus - to be measured (14.1).
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y

psram:
  mode: octal
  speed: 80MHz

logger:
  # decision 5: the S3 default console is USB Serial/JTAG on GPIO19/20, and
  # GPIO19 is the GT911's SDA. Leaving the default collides with touch.
  hardware_uart: UART0

api:
  id: api_server              # every component carries an id, for customisation
  reboot_timeout: 0s          # NET-2: the default 15 min "no HA client" reboot kills the AP
  max_connections: 8          # at the default 5 an extra log viewer is dropped

ota:
  - platform: esphome
    id: ota_esphome
    on_begin: &ota_on_begin
      - lambda: f1::net::ota_begin();     # 2.4.6: pause the data task
      - lvgl.page.show: race_page
      - lambda: |-
          lv_label_set_text(id(ota_title), "Uploading");
          lv_label_set_text(id(ota_pct), "starting");
          lv_obj_remove_flag(id(ota_panel), LV_OBJ_FLAG_HIDDEN);
          lv_refr_now(NULL);              // the OTA write blocks the loop
    on_progress: &ota_on_progress
      - lambda: |-
          static int last = -10;
          int p = (int) x;
          if (p < last + 5 && p < 100) return;
          last = p;
          char b[16];
          snprintf(b, sizeof(b), "%d%%", p);
          lv_label_set_text(id(ota_title), p >= 100 ? "Upgrading" : "Uploading");
          lv_label_set_text(id(ota_pct), b);
          lv_refr_now(NULL);
    on_end: &ota_on_end
      - lambda: |-
          lv_label_set_text(id(ota_title), "Upgrading");
          lv_label_set_text(id(ota_pct), "rebooting");
          lv_refr_now(NULL);
    on_error: &ota_on_error
      - lambda: |-
          lv_label_set_text(id(ota_title), "Upload failed");
          lv_label_set_text(id(ota_pct), "resuming");
          lv_refr_now(NULL);
          f1::net::ota_error();            // resume if the upgrade failed
      - delay: 5s
      - lambda: lv_obj_add_flag(id(ota_panel), LV_OBJ_FLAG_HIDDEN);
  - platform: web_server      # 7.1: firmware upload from the device's own page
    id: ota_web
    on_begin: *ota_on_begin   # 2.4.6: the panel and the paused data task, as for the
    on_progress: *ota_on_progress   # IDE upload - this platform had no hooks at all, so a
    on_end: *ota_on_end       # web-page upload froze the screen on whatever was last drawn
    on_error: *ota_on_error
  - platform: http_request    # "Made for ESPHome": updates over the internet
    id: ota_http
    on_begin:                 # UI-68: the download blocks the loop, so the card is
      - lambda: |-            # redrawn from these hooks, and the data task steps aside
          f1::net::ota_begin();
          f1::upd::ota_begin("Downloading");
    on_progress:
      - lambda: f1::upd::ota_progress(x);
    on_end:
      - lambda: f1::upd::ota_end(true);
    on_error:
      - lambda: |-
          f1::upd::ota_end(false);
          f1::net::ota_error();            // resume if the install failed

wifi:
  # "Made for ESPHome": no credentials here. They arrive over Improv - BLE or
  # USB serial - or from the local wrapper in dev/f1-tracker-dev.yaml. A
  # published config must contain no !secret and must build unmodified.
  id: wifi_comp
  on_connect:
    - lambda: f1::net::wifi_up(true);
  on_disconnect:              # NET-8: no network calls while Wi-Fi is down
    - lambda: f1::net::wifi_up(false);
  ap:                         # NET-2: open fallback AP, renamed with the MAC suffix at boot
    ssid: "F1 Tracker"
  # decision 42 / plane-tracker: ESPHome defaults for ap_timeout and
  # reboot_timeout - sky-tracker's overrides were reversed there.

captive_portal:

web_server:                   # NET-1
  port: 80
  version: 3
  local: true                 # bundle the UI so it also works on the AP with no internet
  sorting_groups:
    - id: grp_race
      name: Race
      sorting_weight: 10
    - id: grp_display
      name: Display
      sorting_weight: 20
    - id: grp_location
      name: Location
      sorting_weight: 30
    - id: grp_system
      name: System
      sorting_weight: 40

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Anchorage
  - platform: homeassistant   # NET-7: sets the clock as soon as HA connects
    id: ha_time
    timezone: America/Anchorage

# ARCH-3: issues no requests here. It is included because it pulls in
# esp_http_client, esp-tls, the certificate bundle and ArduinoJson for the C++
# data task (M3). NET-15's .buffer_size = 4096 is set there, not here.
http_request:
  id: http_client
  verify_ssl: true
  timeout: 20s

# "Made for ESPHome": updates are published as a JSON manifest and fetched over
# the internet. The device checks hourly (see the interval below) and exposes an
# update entity to Home Assistant and the web UI.
update:
  - platform: http_request
    id: fw_update
    name: Firmware Update
    icon: mdi:cloud-download
    # The manifest lives WITH the binaries, as a release asset: ESPHome's
    # updater merges builds[].ota.path with this URL and has no absolute-URL
    # branch, so a manifest on Pages could not point at a release.
    # /releases/latest/download/ is a stable 302 to the newest release.
    source: https://github.com/akcoder/f1-tracker/releases/latest/download/manifest.json
    update_interval: never    # driven by our own hourly interval, so the check
                              # can also be triggered from the settings screen
    web_server: {sorting_group_id: grp_system, sorting_weight: 0}

dashboard_import:
  package_import_url: github://akcoder/f1-tracker/f1-tracker.yaml@main
  import_full_config: false

# Improv is mandatory wherever wifi: appears: it lets someone set credentials
# with no computer. BLE for a phone, serial for a USB cable.
esp32_improv:
  authorizer: none

improv_serial:
  id: improv_uart

safe_mode:
  id: safe_mode_main

# ---------------------------------------------------------------- hardware
spi:
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  - id: bus_a                 # touch (GT911)
    # ESPHome warns that GPIO19/20 belong to the USB-Serial-JTAG interface. That
    # warning is EXPECTED and is precisely why decision 5 pins the console to
    # UART0 - the GT911 owns GPIO19, so the default S3 console would fight it.
    sda: GPIO19
    # GPIO45 is a strapping pin. sky-tracker drives this same panel in production
    # on these exact pins, so it is known-good on this board rather than assumed.
    scl: GPIO45

display:
  - platform: mipi_rgb
    model: GUITION-4848S040   # HW-1/HW-5: pins, timings and 12 MHz pclk from the model
    id: main_display
    update_interval: never
    auto_clear_enabled: false
    transform:                # HW-1: 180 deg (the model default is true/true)
      mirror_x: false
      mirror_y: false

touchscreen:
  - platform: gt911           # HW-2: no transform
    id: touch
    i2c_id: bus_a
    on_touch:                 # UI-44c: a touch wakes the panel for a minute, so
      - lambda: |-            # somebody up at 3 a.m. need not change a setting
          f1::display::touch(f1::display::g_state, esphome::millis());
          if (!id(backlight).current_values.is_on()) {
            auto on = id(backlight).turn_on();
            on.set_brightness(id(bright_day));
            on.perform();
          }

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    # decision 4: 30 kHz, NOT sky-tracker's 1 kHz. 1 kHz is audible - the
    # backlight converter's inductor whines loudest at low duty, which is exactly
    # where auto-dim parks this device for most of an Alaskan winter.
    frequency: 30000Hz
    min_power: ${backlight_min}
    zero_means_zero: true

light:
  - platform: monochromatic   # HW-3
    id: backlight
    name: Backlight Light
    internal: true            # HA and the web UI get the 1-100 % number instead
    output: backlight_pwm
    restore_mode: RESTORE_AND_ON
    default_transition_length: 250ms

# ---------------------------------------------------------------- typography
# UI-40: every font is 4 bpp - ESPHome's default is bpp: 1 (jagged), and
# sky-tracker annotates every font block with that fact, which suggests it was
# learned the hard way.
# UI-40b / decision 35: GF_Latin_Core (319 codepoints) rather than ASCII.
# Verified against all 715 real strings in reference/samples/ and the circuit
# traces: 0 missing, and the data really does contain a-acute, a-tilde, e-acute,
# i-acute, o-acute and u-diaeresis (Hulkenberg, Autodromo Jose Carlos Pace,
# Nurburgring, Hermanos Rodriguez). sky-tracker's ASCII set would draw boxes
# mid-name. decision 51: every size gets the SAME set.
image:
  # A 1x1 placeholder, purely so the LVGL image widgets have a valid src: at
  # compile time. C++ repoints them at the real flag and portrait data in flash
  # (f1_ui.h, f1_order.h) - nothing is ever copied.
  - file: reference/pixel.png
    id: pixel_img
    type: RGB565
  # The mark, made from the Monza trace in f1_circuits.h (tools/gen_logo.py).
  # Shown large on the boot screen; the web UI gets the SVG form (NET-10).
  - file: reference/logo/boot-200.png
    id: boot_logo
    type: RGB565
    resize: 200x200
  - file: reference/logo/boot-200.png     # About page: 112 px, resized when the
    id: about_logo                        # firmware is built, not scaled by LVGL
    type: RGB565
    resize: 112x112

font:
  - file: "gfonts://Roboto Mono"
    id: mono12                # order rows (6.3.1), circuit facts
    size: 12
    bpp: 4
    glyphsets: &glyphs [GF_Latin_Core]
  - file: "gfonts://Roboto Mono"
    id: mono14                # card body
    size: 14
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono16                # titles, buttons
    size: 16
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono18                # card titles
    size: 18
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto Mono@500"
    id: mono24                # clock, OTA panel, watched-driver banner (6.14.3)
    size: 24
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto@300"
    id: setup_title
    size: 34
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto"
    id: setup_body
    size: 22
    bpp: 4
    glyphsets: *glyphs
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi18                 # settings-page row icons. The codepoint list is
    size: 18                  # GENERATED from MDI's own metadata by
    bpp: 4                    # tools/gen_icons.py - guessing one gives a blank
                              # glyph that compiles and only shows on a screen.
    glyphs: ["\U000F0017", "\U000F009E", "\U000F00DF", "\U000F00E1", "\U000F0150", "\U000F0156", "\U000F0162", "\U000F0193", "\U000F023C", "\U000F0241", "\U000F02FD", "\U000F034E", "\U000F0379", "\U000F04BA", "\U000F051B", "\U000F051F", "\U000F053A", "\U000F056C", "\U000F0594", "\U000F05A8", "\U000F05A9", "\U000F061A", "\U000F0835", "\U000F0904", "\U000F0925", "\U000F0A60", "\U000F0BB1", "\U000F0F57", "\U000F0F5A", "\U000F113B"]
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_setup
    size: 44
    bpp: 4
    glyphs: ["\U000F05A9", "\U000F16BE"]        # wifi, wifi-cog

globals:
  - id: from_about            # set by About's Close so the settings page does NOT
    type: bool                # re-stage on return - that would discard unsaved edits and
    initial_value: "false"     # re-capture a live-changed brightness as Cancel's baseline
  - id: bright_on_open        # UI-16: brightness when settings opened (Cancel restores)
    type: float
    initial_value: "1.0"
  - id: bright_day            # UI-44: daytime brightness for auto-dim (0..1)
    type: float
    restore_value: true
    initial_value: "0.8"
  - id: bright_day_open
    type: float
    initial_value: "0.8"

# ---------------------------------------------------------------- entities
# 7.1.2: entities are the single source of truth; LVGL widgets are one VIEW of
# them. A design where the widget owns the value cannot be driven from HA.
button:
  - platform: template        # UI-68b: the web UI / HA twin of Settings > Check for updates
    name: Upgrade Check
    icon: mdi:cloud-refresh
    entity_category: config
    web_server: {sorting_group_id: grp_system, sorting_weight: 1}
    on_press:                 # quiet: no card on the panel - the Firmware row and the
      - lambda: |-            # icon beside the gear show the result
          f1::upd::check_quiet("button");

number:
  - platform: template        # UI-44 / decision 7: feeds sunrise/sunset ONLY
    id: obs_lat
    name: Latitude
    icon: mdi:latitude
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${obs_lat}
    entity_category: config
    web_server: {sorting_group_id: grp_location, sorting_weight: 1}
  - platform: template
    id: obs_lon
    name: Longitude
    icon: mdi:longitude
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${obs_lon}
    entity_category: config
    web_server: {sorting_group_id: grp_location, sorting_weight: 2}
  - platform: template        # HW-6: the light itself is internal
    id: backlight_pct
    name: Brightness
    icon: mdi:brightness-percent
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    web_server: {sorting_group_id: grp_display, sorting_weight: 1}
    set_action:
      - lambda: |-
          float v = x / 100.0f;
          if (id(auto_dim).state) v = std::max(0.01f, v);  // UI-44: sets the DAYTIME level
          auto call = id(backlight).turn_on();
          call.set_brightness(v);
          call.perform();
  - platform: template        # UI-44c: the Auto Off window, local hours
    id: off_from
    name: Auto Off From
    icon: mdi:weather-night
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: h
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 23
    entity_category: config
    web_server: {sorting_group_id: grp_display, sorting_weight: 8}
  - platform: template
    id: off_to
    name: Auto Off Until
    icon: mdi:weather-sunny
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: h
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 7
    entity_category: config
    web_server: {sorting_group_id: grp_display, sorting_weight: 9}
  - platform: template        # UI-20: brief asked 30 s - 1 min; range brackets it
    id: carousel_secs
    name: Carousel Interval
    icon: mdi:timer-outline
    min_value: 15
    max_value: 120
    step: 15
    unit_of_measurement: s
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: ${carousel_default}
    web_server: {sorting_group_id: grp_display, sorting_weight: 3}

switch:
  - platform: template        # UI-44c: blank the panel overnight. Separate from
    id: auto_off              # auto-dim: dim is about light, off is about the
    name: Auto Off            # household being asleep.
    icon: mdi:power-sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: {sorting_group_id: grp_display, sorting_weight: 7}
  - platform: template        # UI-44: the only reason a position is stored
    id: auto_dim
    name: Auto-dim Display
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_display, sorting_weight: 2}
  - platform: template        # 6.14: ships watching Max Verstappen
    id: watched_alerts
    name: Watched Driver Alerts
    icon: mdi:bell-ring
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_race, sorting_weight: 3}
  - platform: template        # 6.14.3: the rare tier without the per-session one
    id: milestone_only
    name: Milestone Alerts Only
    icon: mdi:trophy-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: {sorting_group_id: grp_race, sorting_weight: 4}
  - platform: template
    id: show_practice
    name: Show Practice Sessions
    icon: mdi:timer-sand
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_race, sorting_weight: 5}
  - platform: template        # decision 90: a Sprint is a first-class race day
    id: show_sprint
    name: Show Sprint Sessions
    icon: mdi:flash
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_race, sorting_weight: 6}

select:
  - platform: template        # UI-8 / decision 40
    id: clock_format
    name: Clock Format
    icon: mdi:clock-outline
    options: ["24 h local", "12 h local", "UTC (Zulu)"]
    initial_option: "24 h local"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_display, sorting_weight: 4}
  - platform: template        # UI-20 / decision 68
    id: carousel_content
    name: Carousel Content
    icon: mdi:view-carousel
    options: ["All", "Circuits only", "Drivers only", "Legends only", "Circuits + drivers"]
    initial_option: "All"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_display, sorting_weight: 5}
  - platform: template
    id: carousel_order
    name: Carousel Order
    icon: mdi:sort
    options: ["Calendar", "Random", "Current season only"]
    initial_option: "Calendar"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_display, sorting_weight: 6}
  - platform: template        # 6.14.1 / decision 77: keyed on driverId, never the car number
    id: watched_driver        # M2: options are GENERATED from the compiled driver
    name: Watched Driver      # table - ESPHome select options are compile-time (M0-1)
    icon: mdi:account-star
    options: ["Max Verstappen", "Lando Norris", "Charles Leclerc", "Oscar Piastri",
              "George Russell", "Lewis Hamilton", "Fernando Alonso", "(none)"]
    initial_option: "Max Verstappen"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_race, sorting_weight: 1}
  - platform: template        # 8.2: tint both rows and show the constructors'
    id: favourite_team        # position. ESPHome select options are compile-time
    name: Favourite Team      # (decision 109), so this list is the current grid.
    icon: mdi:shield-star
    options: ["(none)", "Red Bull Racing", "McLaren", "Ferrari", "Mercedes",
              "Aston Martin", "Alpine", "Williams", "Racing Bulls", "Audi",
              "Haas F1 Team", "Cadillac"]
    initial_option: "(none)"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_race, sorting_weight: 9}
  - platform: template        # decision 92: loud ships as the default
    id: alert_style
    name: Alert Style
    icon: mdi:volume-high
    options: ["Loud", "Quiet"]
    initial_option: "Loud"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_race, sorting_weight: 2}
  - platform: template
    id: order_columns
    name: Order Columns
    icon: mdi:table-column
    options: ["With team", "With gap", "With tyre"]
    initial_option: "With team"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_race, sorting_weight: 7}
  - platform: template        # 4.1 / decision 48: deliberately NOT restored
    id: force_page
    name: Force Page
    icon: mdi:page-next-outline
    options: ["Auto", "Race Day", "Carousel"]
    initial_option: "Auto"
    optimistic: true
    entity_category: config
    web_server: {sorting_group_id: grp_system, sorting_weight: 1}

binary_sensor:
  # 8.2: so Home Assistant can act on a session without any code here - dim the
  # lights, turn the TV on, announce it. The device already knows the schedule
  # to the second; exposing it costs nothing.
  - platform: template
    id: session_live
    name: Session Live
    icon: mdi:flag-checkered
    device_class: running
  - platform: template
    id: race_day
    name: Race Day
    icon: mdi:car-sports

text_sensor:
  - platform: template        # 7.1.3: the single most explanatory value
    id: weekend_state
    name: Weekend State
    icon: mdi:state-machine
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_system, sorting_weight: 2}
  - platform: template
    id: order_mode
    name: Order Mode
    icon: mdi:format-list-numbered
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_system, sorting_weight: 3}
  - platform: template        # 4.3: compiled vs fetched, and age
    id: calendar_source
    name: Calendar Source
    icon: mdi:calendar-check
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_system, sorting_weight: 4}
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: IP Address
      icon: mdi:ip-network
      entity_category: diagnostic
      web_server: {sorting_group_id: grp_system, sorting_weight: 5}
    ssid:
      id: wifi_ssid_info
      name: Connected SSID
      icon: mdi:wifi
      entity_category: diagnostic
      web_server: {sorting_group_id: grp_system, sorting_weight: 6}
  - platform: version
    name: ESPHome Version
    icon: mdi:chip
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_system, sorting_weight: 7}

sensor:
  - platform: template        # 8.2: how long until the next session starts, so
    id: next_session_in       # Home Assistant can count down without any code here
    name: Next Session In
    icon: mdi:calendar-clock
    unit_of_measurement: min
    accuracy_decimals: 0
    update_interval: never
    web_server: {sorting_group_id: grp_race, sorting_weight: 8}
  - platform: template        # UI-44: what auto-dim is reading, so a wrong latitude or
    id: sun_elevation         # longitude shows up as a number instead of a dim screen
    name: Sun Elevation
    icon: mdi:white-balance-sunny
    unit_of_measurement: "°"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_display, sorting_weight: 20}
  - platform: wifi_signal
    name: WiFi Signal
    icon: mdi:wifi-strength-3
    update_interval: 60s
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_system, sorting_weight: 8}
  - platform: uptime
    name: Uptime
    icon: mdi:timer-outline
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_system, sorting_weight: 9}

# ---------------------------------------------------------------- UI
lvgl:
  id: lvgl_comp
  displays: main_display
  touchscreens:
    - touchscreen_id: touch
      long_press_time: 1000ms   # UI-27: hold the gear 1 s for the debug page
  # PERF-4: 12.5% (~57.6 kB) asks for internal RAM first. LVGL blends in SRAM and
  # only finished pixels cross to the PSRAM framebuffer, leaving the PSRAM bus to
  # the panel's bounce-buffer refills - starving those is the vsync shift.
  buffer_size: 12.5%
  log_level: WARN
  bg_color: 0x000000
  text_color: 0xC9D3F2
  text_font: mono16
  top_layer:
    widgets:
      - obj:                    # FAIL-12: OTA panel on the TOP layer, so it covers
          id: ota_panel         # whichever page is showing without disturbing it
          align: CENTER
          width: 300
          height: 130
          hidden: true
          bg_color: 0x101B3D
          bg_opa: COVER
          border_color: 0xFF8A1F
          border_width: 2
          radius: 12
          scrollable: false
          pad_all: 0
          widgets:
            - label:
                id: ota_title
                align: CENTER
                y: -14
                text: "Uploading"
                text_font: mono24
                text_color: 0xFF8A1F
            - label:
                id: ota_pct
                align: CENTER
                y: 18
                text: ""
                text_color: 0xC9D3F2   # the theme default is dark grey: invisible here
                text_font: mono16
      - obj:                     # 6.11: the detail card. Top layer, so it covers
          id: detail_panel       # whichever page is showing without disturbing it.
          align: CENTER
          width: 440
          height: 400
          hidden: true
          bg_color: 0x101B3D
          bg_opa: COVER
          border_color: 0x2D5BD0
          border_width: 2
          radius: 12
          pad_all: 0
          scrollable: false
          widgets:
            - label:
                id: detail_title
                x: 16
                y: 12
                width: 340
                text: ""
                text_font: mono18
                text_color: 0xFF8A1F
            - image:
                id: detail_flag
                x: 392
                y: 16
                src: pixel_img
                hidden: true
            - image:                # the portrait, half size (120x160), shown top-down
                id: detail_photo      # as it decodes; hidden for a person without one
                x: 304
                y: 48
                src: pixel_img
                hidden: true
            - label:                # decision 72: the photographer, wherever the photo shows
                id: detail_credit
                x: 304
                y: 212
                width: 120
                text: ""
                text_font: mono12
                text_color: 0x7E8BB3
                hidden: true
            - label:
                id: detail_body
                x: 16
                y: 48
                width: 408
                text: ""
                text_font: mono14
                text_color: 0xC9D3F2
            - label:
                align: BOTTOM_MID
                y: -8
                text: "tap anywhere to close"
                text_font: mono12
                text_color: 0x5A6687
          on_click:
            - lambda: f1::detail::close();
      - obj:                     # 6.14.3: the watched-driver alert. A STRIP, never
          id: watch_banner       # a modal, and nothing ever requires dismissing.
          align: TOP_MID         # It REPLACES the top-5 strip, which hides while
          y: 330                 # it shows - so there is nothing left to crowd -
          width: 480             # and leaves 20 px of clear black below the trace
          height: 92             # (70-310). The map is the thing a reader is
                                 # looking at; decision 92's licence to be loud
                                 # never extended to covering it.
          hidden: true
          bg_color: 0x1A2547
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - image:              # the watched driver's flag, LEFT with real
                id: watch_flag    # padding either side - 24 px in from the edge
                align: LEFT_MID   # and 48 px of clear space before the text
                x: 24
                src: pixel_img
                hidden: true
            - label:
                id: watch_text    # the flag ends at 72, so 48 px of clear space
                align: LEFT_MID   # before the text - 24 read as crowded
                x: 120
                width: 340
                text: ""
                text_font: mono24
                text_color: 0xFFFFFF
                text_align: LEFT
          on_click:              # a tap dismisses EARLY; never the only way out
            - lambda: f1::app::dismiss_banner();
  pages:
    - id: wifi_page             # NET-2b: first page, so it is what boots
      skip: true
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - obj:
            align: CENTER
            width: 380
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 6
            widgets:
              - image:
                  id: boot_mark
                  src: boot_logo
              - label:
                  id: boot_name           # the device's name, plainly (3.7.5)
                  text: "F1 Tracker"
                  text_font: setup_title
                  text_color: 0xFFFFFF
                  width: 380
                  text_align: CENTER
                  pad_top: 10
                  pad_bottom: 8
              - label:
                  id: wifi_title
                  text: "Loading"         # BOOT-2: until start-up ends; then the Wi-Fi status
                  text_font: setup_body
                  text_color: 0xFFFFFF
                  width: 380
                  text_align: CENTER
              - label:
                  id: wifi_body           # NET-2c: the network being tried, or the AP to
                  text: ""                # join - written by the status check below
                  text_font: setup_body
                  text_color: 0xB0B0B0
                  width: 380
                  text_align: CENTER
                  pad_bottom: 18
        - label:
            align: BOTTOM_RIGHT
            x: -10
            y: -8
            text: "v${fw_version}"
            text_font: mono12
            text_color: 0x5A6687

    - id: race_page             # UI-1 (6.2): map + top-5 strip (decision 49)
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_click:
        - if:
            condition: {lambda: 'return f1::app::tap_consumed();'}
            then: []
            else:
              - lvgl.page.next: {animation: FADE_IN, time: 200ms}
      widgets:
        - label:
            id: race_title
            x: 10
            y: 4
            text: "F1 Tracker"
            text_font: mono16
            text_color: 0xFF8A1F
        - label:                # UI-3: the page's most important element.
            id: race_state      # Clock-driven, NEVER lap-driven (decision 62).
            x: 10
            y: 24
            text: "Waiting for data"
            text_font: mono16
            text_color: 0xC9D3F2
        - label:
            id: race_sub
            x: 10
            y: 44
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
        - label:
            id: race_clock
            align: TOP_RIGHT
            x: -10
            y: 1
            text: "--:--"
            text_font: mono24
            text_color: 0xC9D3F2
        - image:                # the CIRCUIT country flag (6.6). Below the clock,
            id: race_flag       # which owns the top-right corner.
            align: TOP_RIGHT
            x: -12
            y: 34
            src: pixel_img
            hidden: true
        - obj:                  # MAP-5a: the trace lives in its own container and
            id: map_box         # nothing moving may sit inside its bounds
            x: 90
            y: 70
            width: 300
            height: 240         # 70-310, clear of the top-5 strip at 318. At 300
                                # it ran 52 px into it.
            bg_opa: TRANSP      # the trace sits on the page's own black - a panel
            border_width: 0     # behind it adds an edge and no information
            radius: 0
            pad_all: 0
            scrollable: false
            clickable: false
        - obj:                  # decision 49: the top-5 STRIP - a summary, not a
            id: top5            # list. Five rows, nothing scrollable.
            x: 6
            y: 318
            width: 270
            height: 104
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
        - label:                # the facts worth seeing beside it
            id: race_facts
            x: 288
            y: 320
            width: 186
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
        - label:                # 3.7.3 / decision 54: attribution is mandatory
            id: attrib
            align: BOTTOM_LEFT
            x: 10
            y: -6
            text: "Data: jolpi.ca · openf1.org"
            text_font: mono12
            text_color: 0x5A6687
        - button:               # UI-16: gear, lower right
            id: gear_btn
            align: BOTTOM_RIGHT
            x: -2
            y: -2
            width: 46
            height: 46
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: ""             # LV_SYMBOL_SETTINGS
                  text_font: montserrat_28
                  text_color: 0xB8BEC9
            on_short_click:                  # short, so a long press does not also open it
              - lvgl.page.show: settings_page
            on_long_press:                   # UI-27
              - lvgl.page.show: debug_page

    - id: order_page            # UI-10 (6.3): 22 rows, mono12, 18 px (decision 88)
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_click:
        - if:
            condition: {lambda: 'return f1::app::tap_consumed();'}
            then: []
            else:
              - lvgl.page.next: {animation: FADE_IN, time: 200ms}
      widgets:
        - label:
            id: order_title
            x: 10
            y: 4
            text: "Grid"
            text_font: mono16
            text_color: 0xFF8A1F
        - label:
            id: order_hdr
            x: 12
            y: 58
            text: "Pos  #   Nat Driver     Team               Gap"
            text_font: mono12
            text_color: 0x7E8BB3
        - obj:                  # UI-10a: rows are built in C++ (M4) - each needs a
            id: order_rows      # flag image and a team-colour bar, which an LVGL
            x: 6                # table cell cannot hold
            y: 76
            width: 468
            height: 396
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false

    - id: circuit_page          # UI-20 (6.4): the default screen most of the year
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_click:
        - if:                   # 6.1: a card open means a tap only closes it
            condition: {lambda: 'return f1::app::tap_consumed();'}
            then: []
            else:
              - lvgl.page.next: {animation: FADE_IN, time: 200ms}
      on_long_press:            # UI-20: hold to pause on the current card
        - lambda: f1::ui::toggle_pause();
      widgets:
        - label:                # 8.2: how far through the season we are
            id: progress
            align: TOP_RIGHT
            x: -10
            y: 8
            text: ""
            text_font: mono12
            text_color: 0x5A6687
        - label:
            id: card_badge      # UI-20b: CIRCUIT / DRIVER / LEGEND
            x: 10
            y: 6
            text: "Circuit"
            text_font: mono12
            text_color: 0xFF8A1F
        - label:
            id: card_title
            x: 10
            y: 24
            text: ""
            text_font: mono18
            text_color: 0xC9D3F2
        - obj:                  # MAP-5a: the trace lives in its own container and
            id: card_map        # nothing moving may sit inside its bounds
            x: 90
            y: 52
            width: 300
            height: 240
            bg_opa: TRANSP      # see map_box: no panel behind the trace
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            clickable: true       # 6.11: tapping the map opens the circuit card
            on_click:
              - lambda: f1::app::open_circuit();
            widgets:
              # MAP-5: the trace, its start/finish tick and the north arrow are
              # declared here so LVGL's line widget is compiled in at all; C++
              # only replaces their point arrays (f1_ui.h).
              - line:
                  id: trace_line
                  points: [{x: 0, y: 0}, {x: 1, y: 0}]
                  line_width: 3
                  line_color: 0xE8EDF7
                  line_rounded: true
              - line:
                  id: trace_tick
                  points: [{x: 0, y: 0}, {x: 1, y: 0}]
                  line_width: 3
                  line_color: 0xFF8A1F
              - line:
                  id: trace_north
                  points: [{x: 0, y: 0}, {x: 1, y: 0}]
                  line_width: 2
                  line_color: 0x7E8BB3
        - image:                # 5.6.3: the portrait. Hidden on a circuit card and
            id: card_photo      # on a person with no attributable image (RACE-13e).
            src: pixel_img
            x: 24
            y: 56
            hidden: true
        - image:                # nationality / circuit country flag (6.6)
            id: card_flag
            src: pixel_img
            x: 300
            y: 30
            hidden: true
        - label:
            id: card_body
            x: 12
            y: 300
            width: 456
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
        - label:                # decision 72: the photographer's credit is
            id: card_credit     # MANDATORY wherever a photo is shown. It and the
            align: BOTTOM_LEFT  # attribution are STACKED: both belong bottom-left
            x: 12               # and one line cannot hold both without collision.
            y: -22
            width: 420
            text: ""
            text_font: mono12
            text_color: 0x5A6687
            hidden: true
        - label:                # 3.7.3 / decision 54: attribution, every page.
            align: BOTTOM_LEFT  # Sits BELOW the photo credit (see card_credit).
            x: 12
            y: -6
            text: "Data: jolpi.ca \u00b7 openf1.org"
            text_font: mono12
            text_color: 0x5A6687

