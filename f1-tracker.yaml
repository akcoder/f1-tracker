      - "UTC"
      - "London"
      - "Central Europe"
      - "Eastern Europe"
      - "Moscow"
      - "India"
      - "China"
      - "Japan"
      - "Sydney"
      - "Auckland"
    entity_category: config
    web_server: {sorting_group_id: grp_location, sorting_weight: 3}
    on_value:
      - lambda: f1::tz::set(i);
  - platform: template        # UI-20 / decision 68
    id: carousel_content
    name: Carousel Content
    icon: mdi:view-carousel
    options: ["All", "Circuits only", "Drivers only", "Legends only", "Circuits + drivers"]
