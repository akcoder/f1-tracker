interval:
  - interval: 1s                # UI-27: debug page, only while it is showing
    then:
      - lambda: |-
          if (!id(debug_page)->is_showing()) return;
          static char b[900];
          const uint32_t s = esphome::millis() / 1000;
          const std::string ip = id(ip_addr).state, ss = id(wifi_ssid_info).state;
          snprintf(b, sizeof(b),
                   "SYSTEM\n  IP %s\n  Wi-Fi %s  %d dBm\n  Firmware %s  ESPHome %s\n"
                   "  Up %ud %02uh %02um\n  RAM %u kB  PSRAM %u kB free\n\n"
                   "DATA\n  Calendar: %s\n  State: %s\n  Order: %s\n",
                   ip.empty() ? "-" : ip.c_str(), ss.empty() ? "-" : ss.c_str(),
                   (int) id(wifi_comp).wifi_rssi(), "${fw_version}", ESPHOME_VERSION,
                   (unsigned) (s / 86400), (unsigned) ((s % 86400) / 3600),
                   (unsigned) ((s % 3600) / 60),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   id(calendar_source).state.empty() ? "compiled" : id(calendar_source).state.c_str(),
                   id(weekend_state).state.empty() ? "-" : id(weekend_state).state.c_str(),
                   id(order_mode).state.empty() ? "-" : id(order_mode).state.c_str());
          lv_label_set_text(id(debug_label), b);
