    icon: mdi:page-next-outline
    options: ["Auto", "Race Day", "Carousel"]
    initial_option: "Auto"
    optimistic: true
    entity_category: config
    web_server: {sorting_group_id: grp_system, sorting_weight: 1}

binary_sensor:
  # 8.2: so Home Assistant can act on a session without any code here - dim the
  # lights, turn the TV on, announce it. The device already knows the schedule
  # to the second; exposing it costs nothing.
  - platform: template
    id: session_live
    name: Session Live
    icon: mdi:flag-checkered
    device_class: running
  - platform: template
    id: race_day
    name: Race Day
    icon: mdi:car-sports

text_sensor:
  - platform: template        # 7.1.3: the single most explanatory value
    id: weekend_state
    name: Weekend State
    icon: mdi:state-machine
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_system, sorting_weight: 2}
  - platform: template
    id: order_mode
    name: Order Mode
    icon: mdi:format-list-numbered
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_system, sorting_weight: 3}
  - platform: template        # 4.3: compiled vs fetched, and age
    id: calendar_source
    name: Calendar Source
    icon: mdi:calendar-check
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_system, sorting_weight: 4}

sensor:
  - platform: template        # 8.2: how long until the next session starts, so
    id: next_session_in       # Home Assistant can count down without any code here
    name: Next Session In
    icon: mdi:calendar-clock
    unit_of_measurement: min
    accuracy_decimals: 0
    update_interval: never
    web_server: {sorting_group_id: grp_race, sorting_weight: 8}
  - platform: template        # UI-44: what auto-dim is reading, so a wrong latitude or
    id: sun_elevation         # longitude shows up as a number instead of a dim screen
    name: Sun Elevation
    icon: mdi:white-balance-sunny
    unit_of_measurement: "°"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_display, sorting_weight: 20}

touchscreen:
  - id: !extend touch
    on_touch:                 # UI-62: every touch is activity; a touch on a dark screen wakes it
      - lambda: |-
          id(last_touch_ms) = esphome::millis();
          if (id(screen_asleep)) id(screen_wake)->execute();

light:
  - id: !extend backlight
    on_state:                 # UI-62: lit from elsewhere (the Backlight number in HA) while asleep is a wake
      - lambda: |-
          if (id(screen_asleep) && id(backlight).remote_values.is_on()) {
            id(screen_asleep) = false;
            id(last_touch_ms) = esphome::millis();
            lv_obj_add_flag(id(wake_shield), LV_OBJ_FLAG_HIDDEN);
          }

lvgl:
  id: lvgl_comp
  displays: main_display
  touchscreens:
    - touchscreen_id: touch
      long_press_time: 1000ms   # UI-27: hold the gear 1 s for the debug page
  # PERF-4: 12.5% (~57.6 kB) asks for internal RAM first. LVGL blends in SRAM and
  # only finished pixels cross to the PSRAM framebuffer, leaving the PSRAM bus to
  # the panel's bounce-buffer refills - starving those is the vsync shift.
  buffer_size: 12.5%
  log_level: WARN
  bg_color: 0x000000
  text_color: 0xC9D3F2
  text_font: mono16
  top_layer:
    widgets:
      - obj:                     # 6.11: the detail card. Top layer, so it covers
          id: detail_panel       # whichever page is showing without disturbing it.
          align: CENTER
          width: 440
          height: 440     # was 400: the longest circuit card (16 lines, Yas Marina) ran into the hint below it
          hidden: true
          bg_color: 0x101B3D
          bg_opa: COVER
          border_color: 0x2D5BD0
          border_width: 2
          radius: 12
          pad_all: 0
          scrollable: false
          widgets:
            - label:
                id: detail_title
                x: 16
                y: 12
                width: 340
                text: ""
                text_font: mono18
                text_color: 0xFF8A1F
            - image:
                id: detail_flag
                x: 392
                y: 16
                src: pixel_img
                hidden: true
            - image:                # the portrait, half size (120x160), shown top-down
                id: detail_photo      # as it decodes; hidden for a person without one
                x: 304
                y: 48
                src: pixel_img
                hidden: true
            - label:                # decision 72: the photographer, wherever the photo shows
                id: detail_credit
                x: 304
                y: 212
                width: 120
                text: ""
                text_font: mono12
                text_color: 0x7E8BB3
                hidden: true
            - label:
                id: detail_body
                x: 16
                y: 48
                width: 408      # decision 202: mono16, a step up (owner: "increase the circuit detail text size")
                text: ""
                text_font: mono16
                text_color: 0xC9D3F2
            - label:
                align: BOTTOM_MID
                y: -8
                text: "tap anywhere to close"
                text_font: mono12
                text_color: 0x5A6687
          on_click:
            - lambda: f1::detail::close();
      - obj:                     # 6.14.3: the watched-driver alert. A STRIP, never
          id: watch_banner       # a modal, and nothing ever requires dismissing.
          align: TOP_MID         # It REPLACES the top-5 strip, which hides while
          y: 330                 # it shows - so there is nothing left to crowd -
          width: 480             # and leaves 20 px of clear black below the trace
          height: 92             # (70-310). The map is the thing a reader is
                                 # looking at; decision 92's licence to be loud
                                 # never extended to covering it.
          hidden: true
          bg_color: 0x1A2547
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - image:              # the watched driver's flag, LEFT with real
                id: watch_flag    # padding either side - 24 px in from the edge
                align: LEFT_MID   # and 48 px of clear space before the text
                x: 24
                src: pixel_img
                hidden: true
            - label:
                id: watch_text    # the flag ends at 72, so 48 px of clear space
                align: LEFT_MID   # before the text - 24 read as crowded
                x: 120
                width: 340
                text: ""
                text_font: mono24
                text_color: 0xFFFFFF
                text_align: LEFT
          on_click:              # a tap dismisses EARLY; never the only way out
            - lambda: f1::app::dismiss_banner();
      - obj:                     # UI-62 (plane-tracker): eats the touch that wakes the screen
          id: wake_shield
          x: 0
          y: 0
          width: 480
          height: 480
          hidden: true
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          radius: 0
          scrollable: false
          clickable: true
          on_release:
            - lvgl.widget.hide: wake_shield
  pages:
    - id: wifi_page             # NET-2b: first page, so it is what boots
      skip: true
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - obj:                      # anchored at the top, not centred: the body grows to two
            align: TOP_MID          # lines in AP mode, and a centred column would move the
            y: 40                   # logo and title up when it does (decision 202)
            width: 380
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              pad_row: 6
            widgets:
              - image:
                  id: boot_mark
                  src: boot_logo
              - obj:                      # the title: the F1 logo, then "Tracker"
                  id: boot_title
                  width: 380
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_top: 10
                  pad_bottom: 8
                  pad_left: 0
                  pad_right: 0
                  scrollable: false
                  layout: {type: FLEX, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 12}
                  widgets:
                    - image:
                        id: boot_f1
                        src: f1_mark
                    - label:
                        id: boot_name           # the device's name, plainly (3.7.5)
                        text: "Tracker"
                        text_font: title_big
                        text_color: 0xFFFFFF
              - label:
                  id: wifi_title
                  text: "Loading"         # BOOT-2: until start-up ends; then the Wi-Fi status
                  text_font: setup_body
                  text_color: 0xFFFFFF
                  width: 380
                  text_align: CENTER
              - label:
                  id: wifi_body           # NET-2c: the network being tried, or the AP to
                  text: ""                # join - written by the status check below
                  text_font: setup_body
                  text_color: 0xB0B0B0
                  width: 380
                  text_align: CENTER
                  pad_bottom: 18
        - label:
            align: BOTTOM_RIGHT
            x: -10
            y: -8
            text: "v${fw_version}"
            text_font: mono12
            text_color: 0x5A6687

    - id: race_page             # UI-1 (6.2): map + top-5 strip (decision 49)
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_click:
        - if:
            condition: {lambda: 'return f1::app::tap_consumed();'}
            then: []
            else:
              - lvgl.page.next: {animation: FADE_IN, time: 200ms}
      widgets:
        - label:
            id: race_title
            x: 10
            y: 4
            text: "F1 Tracker"
            text_font: mono16
            text_color: 0xFF8A1F
        - label:                # UI-3: the page's most important element.
            id: race_state      # Clock-driven, NEVER lap-driven (decision 62).
            x: 10
            y: 24
            text: "Waiting for data"
            text_font: mono16
            text_color: 0xC9D3F2
        - label:
            id: race_sub
            x: 10
            y: 44
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
        - label:
            id: race_clock
            align: TOP_RIGHT
            x: -10
            y: 1
            text: "--:--"
            text_font: mono24
            text_color: 0xC9D3F2
        - image:                # the CIRCUIT country flag (6.6). Below the clock,
            id: race_flag       # which owns the top-right corner.
            align: TOP_RIGHT
            x: -12
            y: 34
            src: pixel_img
            hidden: true
        - obj:                  # MAP-5a: the trace lives in its own container and
            id: map_box         # nothing moving may sit inside its bounds
            x: 90
            y: 70
            width: 300
            height: 240         # 70-310, clear of the top-5 strip at 318. At 300
                                # it ran 52 px into it.
            bg_opa: TRANSP      # the trace sits on the page's own black - a panel
            border_width: 0     # behind it adds an edge and no information
            radius: 0
            pad_all: 0
            scrollable: false
            clickable: false
            widgets:            # decision 202: the race page's own trace - the box had
              - line:           # no children, so the firmware never drew one here
                  id: race_line
                  clickable: false   # decision 202: a line's hit box is its bounding box - it took every press off the map
                  points: [{x: 0, y: 0}, {x: 1, y: 0}]
                  line_width: 3
                  line_color: 0xE8EDF7
                  line_rounded: true
              - line:
                  id: race_tick
                  clickable: false   # decision 202: a line's hit box is its bounding box - it took every press off the map
                  points: [{x: 0, y: 0}, {x: 1, y: 0}]
                  line_width: 3
                  line_color: 0xFF8A1F
              - line:
                  id: race_north
                  clickable: false   # decision 202: a line's hit box is its bounding box - it took every press off the map
                  points: [{x: 0, y: 0}, {x: 1, y: 0}]
                  line_width: 2
                  line_color: 0x7E8BB3
              - label:          # decision 202: the "N" under the arrow; placed by draw_trace
                  id: race_north_n
                  text: "N"
                  text_font: mono12
                  text_color: 0x7E8BB3
                  hidden: true
        - obj:                  # decision 49: the top-5 STRIP - a summary, not a
            id: top5            # list. Five rows, nothing scrollable.
            x: 6
            y: 318
            width: 270
            height: 104
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
        - label:                # the facts worth seeing beside it
            id: race_facts
            x: 288
            y: 320
            width: 186
            text: ""
            text_font: mono13
            text_color: 0x7E8BB3
        - label:                # 3.7.3 / decision 54: attribution is mandatory
            id: attrib
            align: BOTTOM_LEFT
            x: 10
            y: -6
            text: "Data: jolpi.ca · openf1.org"
            text_font: mono12
            text_color: 0x5A6687
        - button:               # UI-16: gear, lower right
            id: gear_btn
            align: BOTTOM_RIGHT
            x: -2
            y: -2
            width: 46
            height: 46
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: ""             # LV_SYMBOL_SETTINGS
                  text_font: montserrat_28
                  text_color: 0xB8BEC9
            on_short_click:                  # short, so a long press does not also open it
              - lvgl.page.show: settings_page
            on_long_press:                   # UI-27
              - lvgl.page.show: debug_page

    - id: order_page            # UI-10 (6.3): 22 rows, mono12, 18 px (decision 88)
      skip: true                # decision 202: out of the page order until there is an entry list
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_click:
        - if:
            condition: {lambda: 'return f1::app::tap_consumed();'}
            then: []
            else:
              - lvgl.page.next: {animation: FADE_IN, time: 200ms}
      widgets:
        - label:
            id: order_title
            x: 10
            y: 4
            text: "Grid"
            text_font: mono16
            text_color: 0xFF8A1F
        - label:                # owner: the clock is in the upper right of every content page
            id: order_clock
            align: TOP_RIGHT
            x: -10
            y: 1
            text: "--:--"
            text_font: mono24
            text_color: 0xC9D3F2
        - label:
            id: order_hdr
            x: 12
            y: 58
            text: "Pos  #   Nat Driver     Team               Gap"
            text_font: mono12
            text_color: 0x7E8BB3
        - obj:                  # UI-10a: rows are built in C++ (M4) - each needs a
            id: order_rows      # flag image and a team-colour bar, which an LVGL
            x: 6                # table cell cannot hold
            y: 76
            width: 468
            height: 396
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
        - button:               # UI-16: gear, lower right (decision 202: on every content page)
            align: BOTTOM_RIGHT
            x: -2
            y: -2
            width: 46
            height: 46
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: ""             # LV_SYMBOL_SETTINGS
                  text_font: montserrat_28
                  text_color: 0xB8BEC9
            on_short_click:                  # short, so a long press does not also open it
              - lvgl.page.show: settings_page
            on_long_press:                   # UI-27
              - lvgl.page.show: debug_page


    - id: circuit_page          # UI-20 (6.4): the default screen most of the year
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_load:                  # decision 202: arriving by a tap starts the three stops
        - lambda: f1::ui::enter_stops(esphome::millis());
      on_short_click:           # short: LVGL sends CLICKED after a long press too, which
        - if:                   # would turn "hold to pause" into a page flip
            condition: {lambda: 'return f1::app::tap_consumed();'}   # 6.1: a card open means a tap only closes it
            then: []
            else:
              - if:             # UI-20f: this page is three stops - a circuit, a driver, a
                  condition: {lambda: 'return f1::ui::tap_next(esphome::millis());'}   # legend - then the next page
                  then: []
