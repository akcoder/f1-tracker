                  width: 300
                  height: 18
                  min_value: 1
                  max_value: 100
                  on_value:
                    # The deliberate exception (decision 38): brightness is applied
                    # LIVE so the change is visible, and Cancel restores it. The guard
                    # against the light's own on_state echo is the comparison.
                    - lambda: |-
                        float v = (float) x / 100.0f;
                        if (id(auto_bright).state) id(bright_day) = v;
                        if (fabsf(id(backlight).current_values.get_brightness() - v) < 0.005f) return;
                        auto call = id(backlight).turn_on();
                        call.set_brightness(v);
                        call.perform();
              - label: {x: 16, y: 116, text: "\U000F0150", text_font: mdi18, text_color: 0x7E8BB3}   # clock-outline (as sky-tracker's Time format row)
              - label: {x: 44, y: 116, text: "Time format", text_font: mono16, text_color: 0xC9D3F2}
              - label: {x: 250, y: 116, text: "12h", text_font: mono16, text_color: 0xC9D3F2}
