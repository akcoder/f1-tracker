    - id: settings_page         # UI-16 (section 7)
      skip: true
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_load:
        # 7 / decision 38: STAGED Save/Cancel. On-screen edits live in the LVGL
        # widgets and are written to entities only on Save; Cancel restores what
        # was captured here. Brightness is the deliberate exception below.
        - lambda: |-
            if (id(from_about)) { id(from_about) = false; return; }   // back from About
            id(bright_on_open) = id(backlight).current_values.get_brightness();
            id(bright_day_open) = id(bright_day);
            auto set = [](lv_obj_t *o, bool on) {
              if (on) lv_obj_add_state(o, LV_STATE_CHECKED);
              else lv_obj_remove_state(o, LV_STATE_CHECKED);
            };
            set(id(sw_autodim), id(auto_dim).state);
            set(id(sw_autooff), id(auto_off).state);
            set(id(sw_alerts), id(watched_alerts).state);
            set(id(sw_milestone), id(milestone_only).state);
            lv_slider_set_value(id(sl_carousel), (int) id(carousel_secs).state, LV_ANIM_OFF);
            lv_slider_set_value(id(sl_bright),
                (int) roundf((id(auto_dim).state ? id(bright_day)
                                                 : id(bright_on_open)) * 100.0f), LV_ANIM_OFF);
            f1::ui::settings_labels(id(lbl_carousel), (int) id(carousel_secs).state);
            char nb[16];
            snprintf(nb, sizeof(nb), "%.3f", (double) id(obs_lat).state);
            lv_textarea_set_text(id(ta_lat), nb);
            snprintf(nb, sizeof(nb), "%.3f", (double) id(obs_lon).state);
            lv_textarea_set_text(id(ta_lon), nb);
            snprintf(nb, sizeof(nb), "%d", (int) id(off_from).state);
            lv_textarea_set_text(id(ta_off_from), nb);
            snprintf(nb, sizeof(nb), "%d", (int) id(off_to).state);
            lv_textarea_set_text(id(ta_off_to), nb);
            lv_label_set_text(id(settings_err), "");
            lv_obj_add_flag(id(settings_kb)->obj, LV_OBJ_FLAG_HIDDEN);
            lv_obj_t *pnl[3] = {id(pnl_display), id(pnl_race), id(pnl_location)};
            lv_obj_t *btn[3] = {id(tab_display), id(tab_race), id(tab_location)};
            f1::ui::settings_tab(pnl, btn, 0, id(settings_title));
      widgets:
        - label:                # UI-16a (sky-tracker): the header names the open tab
            id: settings_title
            x: 16
            y: 14
            text: "DISPLAY"
            text_font: mono16
            text_color: 0xFF8A1F
        - button:
            x: 238
            y: 8
            width: 110
            height: 38
            bg_color: 0x1A2547
            shadow_width: 0
            widgets:
              - label: {text: "Cancel", align: CENTER, text_font: mono16, text_color: 0xC9D3F2}
            on_click:
              # Cancel restores the brightness captured in on_load - the one
              # setting that was applied live.
              - lambda: id(bright_day) = id(bright_day_open);
              - light.turn_on:
                  id: backlight
                  brightness: !lambda return id(bright_on_open);
                  transition_length: 0s
              - lvgl.page.show: race_page
        - button:
            x: 356
            y: 8
            width: 110
            height: 38
            bg_color: 0x2D5BD0
            shadow_width: 0
            widgets:
              - label: {text: "Save", align: CENTER, text_font: mono16, text_color: 0xC9D3F2}
            on_click:
              # 7.1.2: every change routes through the ENTITIES, which are the
              # single source of truth. The widgets are one view of them.
              # Validation lives HERE, not in the widget (7.1.2, 6.8): the
              # keypad cannot stop "-" or "95". Nothing is written until every
              # field is valid, and a clamped value is shown back to the user
              # and the page stays open - clamping with visible feedback.
              - lambda: lv_obj_add_flag(id(settings_kb)->obj, LV_OBJ_FLAG_HIDDEN);
              - if:
                  condition:
                    lambda: |-
                      float lat = 0, lon = 0, from = 0, until = 0;
                      auto field = [&](lv_obj_t *ta, float lo, float hi, const char *name,
                                       const char *fmt, float *out) -> bool {
                        const char *t = lv_textarea_get_text(ta);
                        char *end = nullptr;
                        float v = strtof(t, &end);
                        char msg[48], txt[16];
                        if (t[0] == 0 || end == t || *end != 0) {
                          snprintf(msg, sizeof(msg), "%s is not a number", name);
                          lv_label_set_text(id(settings_err), msg);
                          return false;
                        }
                        if (v < lo || v > hi) {
                          v = v < lo ? lo : hi;
                          snprintf(txt, sizeof(txt), fmt, (double) v);
                          lv_textarea_set_text(ta, txt);
                          snprintf(msg, sizeof(msg), "%s limited to %s", name, txt);
                          lv_label_set_text(id(settings_err), msg);
                          return false;
                        }
                        *out = v;
                        return true;
                      };
                      if (!field(id(ta_lat), -90, 90, "Latitude", "%.3f", &lat)) return false;
                      if (!field(id(ta_lon), -180, 180, "Longitude", "%.3f", &lon)) return false;
                      if (!field(id(ta_off_from), 0, 23, "Off from", "%.0f", &from)) return false;
                      if (!field(id(ta_off_to), 0, 23, "Off until", "%.0f", &until)) return false;
                      auto sw = [](lv_obj_t *o, switch_::Switch *e) {
                        if (lv_obj_has_state(o, LV_STATE_CHECKED)) e->turn_on(); else e->turn_off();
                      };
                      sw(id(sw_autodim), id(auto_dim));
                      sw(id(sw_autooff), id(auto_off));
                      sw(id(sw_alerts), id(watched_alerts));
                      sw(id(sw_milestone), id(milestone_only));
                      id(carousel_secs).make_call()
                          .set_value(lv_slider_get_value(id(sl_carousel))).perform();
                      id(obs_lat).make_call().set_value(lat).perform();
                      id(obs_lon).make_call().set_value(lon).perform();
                      id(off_from).make_call().set_value(from).perform();
                      id(off_to).make_call().set_value(until).perform();
                      return true;
                  then:
                    - lvgl.page.show: race_page

        - button:
            id: tab_display
            x: 4
            y: 52
            width: 152
            height: 44
            radius: 8
            bg_color: 0x1A2547
