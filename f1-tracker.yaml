# F1 Tracker - Guition ESP32-4848S040 (REQUIREMENTS.md rev 8)
# Third board after sky-tracker (installed) and plane-tracker. Same panel, same
# UI cues. Files: f1-tracker.yaml plus C++ headers in f1-tracker/.
# M0 scope: hardware, platform tuning, entities, page shells. No data layer yet.

substitutions:
  fw_version: "0.1.0"         # bump on every install; shown in HA, settings and the status page
  name: f1-tracker
  friendly_name: F1 Tracker
  # UI-44: the ONLY use of a position is computing sunrise/sunset for auto-dim
  # (decision 7). Nothing on screen is plotted from it.
  obs_lat: "61.581"
  obs_lon: "-149.439"
  backlight_min: "0.10"       # HW-6: lowest duty still visible; raise if the panel
                              # goes dark at the bottom of the brightness slider
  carousel_default: "45"      # UI-20: seconds per card (brief asked 30 s - 1 min)
  wifi_name: !secret wifi_ssid

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: dan.f1_tracker
    version: "${fw_version}"
  build_flags:
    # PERF-8: LVGL tracks 32 dirty areas by default and redraws the WHOLE screen
    # when they overflow. Our risk is not moving markers (nothing here moves
    # per-frame) but a 22-row order page plus flags, bars, clock and banner
    # comfortably exceeding 32 regions during a race weekend.
    - "-DLV_INV_BUF_SIZE=128"
  includes:
    - f1-tracker/f1_panel.h
  on_boot:
    - priority: 1100           # HW-7: before the SPI bus (1000) and the panel init
      then:
        - lambda: |-
            f1::panel_soft_reset(39, 48, 47);   // CS, SCK, MOSI of GUITION-4848S040
            // NET-2: fallback AP named "F1 Tracker - XXXX" (last MAC bytes).
            // Must be set before WiFi starts (250); ESPHome's ssid: is a literal.
            uint8_t mac[6];
            get_mac_address_raw(mac);
            char ssid[33];
            snprintf(ssid, sizeof(ssid), "F1 Tracker - %02X%02X", mac[4], mac[5]);
            auto ap = id(wifi_comp).get_ap();
            ap.set_ssid(ssid);
            id(wifi_comp).set_ap(ap);

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  # 2.4.5 / decision 6: DEFAULT partition table. No skydata-style data partition -
  # the calendar is compiled in instead (decision 12), and the default table
  # leaves larger OTA app slots, which matters because the portraits (decision 91)
  # are 25-30% of one slot. OTA cannot move partitions: settled before first flash.
  framework:
    type: esp-idf
    sdkconfig_options:
      # PERF-2: re-sync panel DMA every vblank so a stall cannot leave the picture
      # permanently shifted.
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: y
      # PERF-10: run code and rodata from PSRAM. Flash and PSRAM share one bus on
      # the S3: flash fetches starved the panel's refills (jitter) and flash writes
      # stalled the cache entirely (shift during uploads). This replaces the need
      # for CONFIG_LCD_RGB_ISR_IRAM_SAFE, which must still NOT be added (PERF-3).
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # NET-15 (decision 99): 64 KB receive window, up from sky-tracker's 32 KB.
      # Throughput is capped at window/RTT and these hosts are ~100 ms away. At
      # 32 KB our largest response (47.0 KB) needs TWO windows and stalls a full
      # round-trip mid-transfer; at 64 KB every response the device ever makes
      # fits in ONE. 48 KB worst case: 250 ms -> 75 ms.
      # 65535 is the largest UNSCALED window, so CONFIG_LWIP_WND_SCALE stays off
      # (decision 100) - going further buys 37 ms on a rare fetch.
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      # Must scale with the window: >= window/MSS = 65535/1440 = 46 (decision 101).
      # Left at 32 this throttles the larger window back to what it replaced.
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      # A lost segment costs more behind a 64 KB window than a 32 KB one.
      CONFIG_LWIP_TCP_SACK_OUT: y
      # Keep lwIP/WiFi buffers out of the ~70 kB of free internal RAM. The 64 KB
      # windows therefore come from PSRAM - capacity is nothing against 8 MB, but
      # the BANDWIDTH shares a bus with the panel (see 14.1).
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y

psram:
  mode: octal
  speed: 80MHz

logger:
  # decision 5: the S3 default console is USB Serial/JTAG on GPIO19/20, and
  # GPIO19 is the GT911's SDA. Leaving the default collides with touch.
  hardware_uart: UART0

api:
  reboot_timeout: 0s          # NET-2: the default 15 min "no HA client" reboot kills the AP
  max_connections: 8          # at the default 5 an extra log viewer is dropped
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:               # BUILD-1: reuses the API encryption key
  - platform: web_server      # 7.1: firmware upload from the device's own page.
                              # Declared EXPLICITLY so its plaintext /update
                              # endpoint is a deliberate choice, not an implicit
                              # default - it is gated by web_server auth below.

wifi:
  id: wifi_comp
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                         # NET-2: open fallback AP, renamed with the MAC suffix at boot
    ssid: "F1 Tracker"
  # decision 42 / plane-tracker: ESPHome defaults for ap_timeout and
  # reboot_timeout - sky-tracker's overrides were reversed there.

captive_portal:

web_server:                   # NET-1
  port: 80
  version: 3
  local: true                 # bundle the UI so it also works on the AP with no internet
  auth:                       # 7.1: the page controls every setting
    type: digest              # basic sends the password reversibly; the ESPHome
                              # default flips to digest in 2027.1.0 anyway
    username: !secret web_username
    password: !secret web_password
  sorting_groups:
    - id: grp_race
      name: Race
      sorting_weight: 10
    - id: grp_display
      name: Display
      sorting_weight: 20
    - id: grp_location
      name: Location
      sorting_weight: 30
    - id: grp_system
      name: System
      sorting_weight: 40

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Anchorage
  - platform: homeassistant   # NET-7: sets the clock as soon as HA connects
    id: ha_time
    timezone: America/Anchorage

# ARCH-3: issues no requests here. It is included because it pulls in
# esp_http_client, esp-tls, the certificate bundle and ArduinoJson for the C++
# data task (M3). NET-15's .buffer_size = 4096 is set there, not here.
http_request:
  verify_ssl: true
  timeout: 15s

# ---------------------------------------------------------------- hardware
spi:
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  - id: bus_a                 # touch (GT911)
    # ESPHome warns that GPIO19/20 belong to the USB-Serial-JTAG interface. That
    # warning is EXPECTED and is precisely why decision 5 pins the console to
    # UART0 - the GT911 owns GPIO19, so the default S3 console would fight it.
    sda: GPIO19
    # GPIO45 is a strapping pin. sky-tracker drives this same panel in production
    # on these exact pins, so it is known-good on this board rather than assumed.
    scl: GPIO45

display:
  - platform: mipi_rgb
    model: GUITION-4848S040   # HW-1/HW-5: pins, timings and 12 MHz pclk from the model
    id: main_display
    update_interval: never
    auto_clear_enabled: false
    transform:                # HW-1: 180 deg (the model default is true/true)
      mirror_x: false
      mirror_y: false

touchscreen:
  - platform: gt911           # HW-2: no transform
    id: touch
    i2c_id: bus_a

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    # decision 4: 30 kHz, NOT sky-tracker's 1 kHz. 1 kHz is audible - the
    # backlight converter's inductor whines loudest at low duty, which is exactly
    # where auto-dim parks this device for most of an Alaskan winter.
    frequency: 30000Hz
    min_power: ${backlight_min}
    zero_means_zero: true

light:
  - platform: monochromatic   # HW-3
    id: backlight
    name: Backlight Light
    internal: true            # HA and the web UI get the 1-100 % number instead
    output: backlight_pwm
    restore_mode: RESTORE_AND_ON
    default_transition_length: 250ms

# ---------------------------------------------------------------- typography
# UI-40: every font is 4 bpp - ESPHome's default is bpp: 1 (jagged), and
# sky-tracker annotates every font block with that fact, which suggests it was
# learned the hard way.
# UI-40b / decision 35: GF_Latin_Core (319 codepoints) rather than ASCII.
# Verified against all 715 real strings in reference/samples/ and the circuit
# traces: 0 missing, and the data really does contain a-acute, a-tilde, e-acute,
# i-acute, o-acute and u-diaeresis (Hulkenberg, Autodromo Jose Carlos Pace,
# Nurburgring, Hermanos Rodriguez). sky-tracker's ASCII set would draw boxes
# mid-name. decision 51: every size gets the SAME set.
font:
  - file: "gfonts://Roboto Mono"
    id: mono12                # order rows (6.3.1), circuit facts
    size: 12
    bpp: 4
    glyphsets: &glyphs [GF_Latin_Core]
  - file: "gfonts://Roboto Mono"
    id: mono14                # card body
    size: 14
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono16                # titles, buttons
    size: 16
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono18                # card titles
    size: 18
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto Mono@500"
    id: mono24                # clock, OTA panel, watched-driver banner (6.14.3)
    size: 24
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto@300"
    id: setup_title
    size: 34
    bpp: 4
    glyphsets: *glyphs
  - file: "gfonts://Roboto"
    id: setup_body
    size: 22
    bpp: 4
    glyphsets: *glyphs
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_setup
    size: 44
    bpp: 4
    glyphs: ["\U000F05A9", "\U000F16BE"]        # wifi, wifi-cog

globals:
  - id: bright_on_open        # UI-16: brightness when settings opened (Cancel restores)
    type: float
    initial_value: "1.0"
  - id: bright_day            # UI-44: daytime brightness for auto-dim (0..1)
    type: float
    restore_value: true
    initial_value: "0.8"
  - id: bright_day_open
    type: float
    initial_value: "0.8"

# ---------------------------------------------------------------- entities
# 7.1.2: entities are the single source of truth; LVGL widgets are one VIEW of
# them. A design where the widget owns the value cannot be driven from HA.
number:
  - platform: template        # UI-44 / decision 7: feeds sunrise/sunset ONLY
    id: obs_lat
    name: Latitude
    icon: mdi:latitude
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${obs_lat}
    entity_category: config
    web_server: {sorting_group_id: grp_location, sorting_weight: 1}
  - platform: template
    id: obs_lon
    name: Longitude
    icon: mdi:longitude
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${obs_lon}
    entity_category: config
    web_server: {sorting_group_id: grp_location, sorting_weight: 2}
  - platform: template        # HW-6: the light itself is internal
    id: backlight_pct
    name: Brightness
    icon: mdi:brightness-percent
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    web_server: {sorting_group_id: grp_display, sorting_weight: 1}
    set_action:
      - lambda: |-
          float v = x / 100.0f;
          if (id(auto_dim).state) v = std::max(0.01f, v);  // UI-44: sets the DAYTIME level
          auto call = id(backlight).turn_on();
          call.set_brightness(v);
          call.perform();
  - platform: template        # UI-20: brief asked 30 s - 1 min; range brackets it
    id: carousel_secs
    name: Carousel Interval
    icon: mdi:timer-outline
    min_value: 15
    max_value: 120
    step: 15
    unit_of_measurement: s
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: ${carousel_default}
    web_server: {sorting_group_id: grp_display, sorting_weight: 3}

switch:
  - platform: template        # UI-44: the only reason a position is stored
    id: auto_dim
    name: Auto-dim Display
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_display, sorting_weight: 2}
  - platform: template        # 6.14: ships watching Max Verstappen
    id: watched_alerts
    name: Watched Driver Alerts
    icon: mdi:bell-ring
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_race, sorting_weight: 3}
  - platform: template        # 6.14.3: the rare tier without the per-session one
    id: milestone_only
    name: Milestone Alerts Only
    icon: mdi:trophy-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: {sorting_group_id: grp_race, sorting_weight: 4}
  - platform: template
    id: show_practice
    name: Show Practice Sessions
    icon: mdi:timer-sand
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_race, sorting_weight: 5}
  - platform: template        # decision 90: a Sprint is a first-class race day
    id: show_sprint
    name: Show Sprint Sessions
    icon: mdi:flash
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: grp_race, sorting_weight: 6}

select:
  - platform: template        # UI-8 / decision 40
    id: clock_format
    name: Clock Format
    icon: mdi:clock-outline
    options: ["24 h local", "12 h local", "UTC (Zulu)"]
    initial_option: "24 h local"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_display, sorting_weight: 4}
  - platform: template        # UI-20 / decision 68
    id: carousel_content
    name: Carousel Content
    icon: mdi:view-carousel
    options: ["All", "Circuits only", "Drivers only", "Legends only", "Circuits + drivers"]
    initial_option: "All"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_display, sorting_weight: 5}
  - platform: template
    id: carousel_order
    name: Carousel Order
    icon: mdi:sort
    options: ["Calendar", "Random", "Current season only"]
    initial_option: "Calendar"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_display, sorting_weight: 6}
  - platform: template        # 6.14.1 / decision 77: keyed on driverId, never the car number
    id: watched_driver        # M2: options are GENERATED from the compiled driver
    name: Watched Driver      # table - ESPHome select options are compile-time (M0-1)
    icon: mdi:account-star
    options: ["Max Verstappen", "Lando Norris", "Charles Leclerc", "Oscar Piastri",
              "George Russell", "Lewis Hamilton", "Fernando Alonso", "(none)"]
    initial_option: "Max Verstappen"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_race, sorting_weight: 1}
  - platform: template        # decision 92: loud ships as the default
    id: alert_style
    name: Alert Style
    icon: mdi:volume-high
    options: ["Loud", "Quiet"]
    initial_option: "Loud"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_race, sorting_weight: 2}
  - platform: template
    id: order_columns
    name: Order Columns
    icon: mdi:table-column
    options: ["With team", "With gap", "With tyre"]
    initial_option: "With team"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_race, sorting_weight: 7}
  - platform: template        # 4.1 / decision 48: deliberately NOT restored
    id: force_page
    name: Force Page
    icon: mdi:page-next-outline
    options: ["Auto", "Race Day", "Carousel"]
    initial_option: "Auto"
    optimistic: true
    entity_category: config
    web_server: {sorting_group_id: grp_system, sorting_weight: 1}

text_sensor:
  - platform: template        # 7.1.3: the single most explanatory value
    id: weekend_state
    name: Weekend State
    icon: mdi:state-machine
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_system, sorting_weight: 2}
  - platform: template
    id: order_mode
    name: Order Mode
    icon: mdi:format-list-numbered
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_system, sorting_weight: 3}
  - platform: template        # 4.3: compiled vs fetched, and age
    id: calendar_source
    name: Calendar Source
    icon: mdi:calendar-check
    entity_category: diagnostic
    update_interval: never
    web_server: {sorting_group_id: grp_system, sorting_weight: 4}
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: IP Address
      entity_category: diagnostic
      web_server: {sorting_group_id: grp_system, sorting_weight: 5}
    ssid:
      id: wifi_ssid_info
      name: Connected SSID
      entity_category: diagnostic
      web_server: {sorting_group_id: grp_system, sorting_weight: 6}
  - platform: version
    name: ESPHome Version
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_system, sorting_weight: 7}

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_system, sorting_weight: 8}
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_system, sorting_weight: 9}

# ---------------------------------------------------------------- UI
lvgl:
  id: lvgl_comp
  displays: main_display
  touchscreens:
    - touchscreen_id: touch
      long_press_time: 1000ms   # UI-27: hold the gear 1 s for the debug page
  # PERF-4: 12.5% (~57.6 kB) asks for internal RAM first. LVGL blends in SRAM and
  # only finished pixels cross to the PSRAM framebuffer, leaving the PSRAM bus to
  # the panel's bounce-buffer refills - starving those is the vsync shift.
  buffer_size: 12.5%
  log_level: WARN
  bg_color: 0x000000
  text_color: 0xC9D3F2
  text_font: mono16
  top_layer:
    widgets:
      - obj:                    # FAIL-12: OTA panel on the TOP layer, so it covers
          id: ota_panel         # whichever page is showing without disturbing it
          align: CENTER
          width: 300
          height: 130
          hidden: true
          bg_color: 0x101B3D
          bg_opa: COVER
          border_color: 0xFF8A1F
          border_width: 2
          radius: 12
          scrollable: false
          pad_all: 0
          widgets:
            - label:
                id: ota_title
                align: CENTER
                y: -14
                text: "UPGRADING"
                text_font: mono24
                text_color: 0xFF8A1F
            - label:
                id: ota_pct
                align: CENTER
                y: 18
                text: ""
                text_color: 0xC9D3F2   # the theme default is dark grey: invisible here
                text_font: mono16
  pages:
    - id: wifi_page             # NET-2b: first page, so it is what boots
      skip: true
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - obj:
            align: CENTER
            width: 380
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 36
            widgets:
              - label:
                  text: "\U000F05A9"       # mdi:wifi
                  text_font: mdi_setup
                  text_color: 0xFFFFFF
              - label:
                  text: "Connecting to Wi-Fi"
                  text_font: setup_title
                  text_color: 0xFFFFFF
                  width: 380
                  text_align: CENTER
              - label:
                  text: "${wifi_name}"
                  text_font: setup_body
                  text_color: 0xB0B0B0
                  width: 380
                  text_align: CENTER
        - label:
            align: BOTTOM_RIGHT
            x: -10
            y: -8
            text: "v${fw_version}"
            text_font: mono12
            text_color: 0x5A6687

    - id: race_page             # UI-1 (6.2): map + top-5 strip (decision 49)
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_click:
        - lvgl.page.next: {animation: FADE_IN, time: 200ms}
      widgets:
        - label:
            id: race_title
            x: 10
            y: 4
            text: "F1 TRACKER"
            text_font: mono16
            text_color: 0xFF8A1F
        - label:                # UI-3: the page's most important element.
            id: race_state      # Clock-driven, NEVER lap-driven (decision 62).
            x: 10
            y: 24
            text: "WAITING FOR DATA"
            text_font: mono16
            text_color: 0xC9D3F2
        - label:
            id: race_sub
            x: 10
            y: 44
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
        - label:
            id: race_clock
            align: TOP_RIGHT
            x: -10
            y: 1
            text: "--:--"
            text_font: mono24
            text_color: 0xC9D3F2
        - obj:                  # MAP-5a: the trace lives in its own container and
            id: map_box         # nothing moving may sit inside its bounds
            x: 90
            y: 70
            width: 300
            height: 300
            bg_color: 0x0B1220
            bg_opa: COVER
            border_width: 0
            radius: 8
            pad_all: 0
            scrollable: false
            clickable: false
        - label:                # 3.7.3 / decision 54: attribution is mandatory
            id: attrib
            align: BOTTOM_LEFT
            x: 10
            y: -6
            text: "Data: jolpi.ca · openf1.org"
            text_font: mono12
            text_color: 0x5A6687
        - button:               # UI-16: gear, lower right
            id: gear_btn
            align: BOTTOM_RIGHT
            x: -2
            y: -2
            width: 46
            height: 46
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: ""             # LV_SYMBOL_SETTINGS
                  text_font: montserrat_28
                  text_color: 0xB8BEC9
            on_short_click:                  # short, so a long press does not also open it
              - lvgl.page.show: settings_page
            on_long_press:                   # UI-27
              - lvgl.page.show: debug_page

    - id: order_page            # UI-10 (6.3): 22 rows, mono12, 18 px (decision 88)
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_click:
        - lvgl.page.next: {animation: FADE_IN, time: 200ms}
      widgets:
        - label:
            id: order_title
            x: 10
            y: 4
            text: "GRID"
            text_font: mono16
            text_color: 0xFF8A1F
        - label:
            id: order_hdr
            x: 12
            y: 58
            text: "POS  #   NAT DRIVER     TEAM              GAP"
            text_font: mono12
            text_color: 0x7E8BB3
        - obj:                  # UI-10a: rows are built in C++ (M4) - each needs a
            id: order_rows      # flag image and a team-colour bar, which an LVGL
            x: 6                # table cell cannot hold
            y: 76
            width: 468
            height: 396
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false

    - id: circuit_page          # UI-20 (6.4): the default screen most of the year
      bg_color: 0x000000
      bg_opa: COVER
