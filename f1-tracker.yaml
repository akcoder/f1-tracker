interval:
  - interval: 1s                # the application tick (f1_app.h). Everything on
    then:                       # screen is a function of ONE state (4.1), so this
      - lambda: |-              # is the only place that reads it and writes widgets.
          const auto t = id(sntp_time).now();
          f1::app::set_clock(t.is_valid() ? (uint32_t) t.timestamp : 0, t.is_valid());
          f1::app::tick(esphome::millis());
          {  // 8.2: Home Assistant triggers
            const auto &st = f1::app::g.st;
            const bool live = st.weekend == f1::state::SESSION_LIVE ||
                              st.weekend == f1::state::RACE_LIVE;
            // The first value is published too, else HA shows "unknown" until a session
            if (!id(session_live).has_state() || id(session_live).state != live)
              id(session_live).publish_state(live);
            const bool rday = st.weekend == f1::state::RACE_LIVE ||
                              (st.weekend == f1::state::SESSION_SOON && st.next.valid() &&
                               f1::state::is_race(st.next.session));
            if (!id(race_day).has_state() || id(race_day).state != rday)
              id(race_day).publish_state(rday);
            if (st.to_next > 0) id(next_session_in).publish_state(st.to_next / 60.0f);
          }
          if (t.is_valid()) f1::ui::update_birthday(t.year, t.month, t.day_of_month);
          if (t.is_valid()) {
            char b[12];
            // UI-17 (sky-tracker's): 24 h "14:05", or 12 h "2:05 PM"
            if (id(clock_24h).state) snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            else snprintf(b, sizeof(b), "%d:%02d %s", t.hour % 12 == 0 ? 12 : t.hour % 12, t.minute, t.hour < 12 ? "AM" : "PM");
            for (lv_obj_t *c : {id(race_clock), id(order_clock), id(circuit_clock), id(standings_clock), id(summary_clock)})
              if (strcmp(lv_label_get_text(c), b) != 0) lv_label_set_text(c, b);
          }
  - interval: 2s                # NET-2b: the boot / Wi-Fi page. Nothing else leaves it,
    then:                       # so this is what takes the device to its real page.
      - lambda: |-
          static f1::boot::Tracker tr;
          const auto link = f1::boot::classify(id(wifi_comp).is_connected(),
                                               id(wifi_comp).is_ap_active());
          const auto st = f1::boot::step(tr, link, esphome::millis(),
                                         id(wifi_page)->is_showing(),
                                         id(settings_page)->is_showing(),
                                         f1::app::g.st.weekend);
          if (st.link_changed && link != f1::boot::CONNECTED)
            lv_label_set_text(id(wifi_title), f1::boot::title_for(link));
          if (link != f1::boot::CONNECTED) {
            // NET-2c: the entry ESPHome selected - saved in flash by Improv, or
            // built in. Refreshed while it shows, because it can change under us.
            // get_sta()/get_ap() return a COPY of the entry and get_ssid() a StringRef into
            // it, so the copies must outlive the call - a ref taken off the temporary read
            // freed memory and the panel showed fragments of this very buffer in the name.
            const auto sta_entry = id(wifi_comp).get_sta();
            const auto ap_entry = id(wifi_comp).get_ap();
            const auto sta = sta_entry.get_ssid();
            const auto ap = ap_entry.get_ssid();
            char b[96];
            f1::boot::body_for(link, sta.c_str(), ap.c_str(), b, sizeof(b));
            if (strcmp(lv_label_get_text(id(wifi_body)), b) != 0) lv_label_set_text(id(wifi_body), b);
          }
          // UI-68a: the update icon sits beside the gear, so only on pages that have one
          tracker::upd::set_page_ok(id(race_page)->is_showing() || id(order_page)->is_showing() ||
                               id(circuit_page)->is_showing() || id(standings_page)->is_showing() ||
                               id(summary_page)->is_showing());
          // MOTION-5: a dinosaur walks by now and then, where nothing is over the page and the panel is lit
          const bool critter_ok = tracker::upd::page_ok && tracker::upd::ui_.root == nullptr &&
                                  !f1::detail::is_open() && id(backlight).current_values.is_on();
          f1::dino::tick(esphome::millis(), critter_ok && !f1::toucan::flying() && !f1::carl::walking());
          // MOTION-6: the toucan, never over the dinosaur (each draws over a snapshot of the screen)
          f1::toucan::tick(esphome::millis(), critter_ok && !f1::dino::walking() && !f1::carl::walking());
          // MOTION-8: Carl, about one visit in a hundred, and only where there is a face to bite
          f1::carl::tick(esphome::millis(), critter_ok && !f1::dino::walking() && !f1::toucan::flying());
          switch (st.page) {
            case f1::boot::TO_RACE:
              id(lvgl_comp)->show_page(id(race_page)->index, LV_SCREEN_LOAD_ANIM_FADE_IN, 300); break;
            case f1::boot::TO_CIRCUIT:
              id(lvgl_comp)->show_page(id(circuit_page)->index, LV_SCREEN_LOAD_ANIM_FADE_IN, 300); break;
            case f1::boot::TO_STATUS:
              id(lvgl_comp)->show_page(id(wifi_page)->index, LV_SCREEN_LOAD_ANIM_FADE_IN, 300); break;
            default: break;
          }
  - interval: 2s                # UI-72 (sky-tracker): 60 s untouched closes what is open
    then:
      - lambda: |-
          if (lv_display_get_inactive_time(nullptr) < 60000) return;
          tracker::upd::idle_close();                 // an offer or result closes as Not now
          if (id(settings_page)->is_showing()) {
            // as Cancel: nothing saved, the live brightness put back
            id(bright_day) = id(bright_day_open);
            auto call = id(backlight).turn_on();
            call.set_brightness(id(bright_on_open));
            call.set_transition_length(0);
            call.perform();
            id(lvgl_comp)->show_page(id(race_page)->index, LV_SCREEN_LOAD_ANIM_NONE, 0);
          } else if (id(about_page)->is_showing() || id(debug_page)->is_showing()) {
            id(lvgl_comp)->show_page(id(race_page)->index, LV_SCREEN_LOAD_ANIM_NONE, 0);
          }
  - interval: 10min             # decision 203: the memory line again, at DEBUG, for a long log
    then:
      - lambda: |-
          ESP_LOGD("mem", "internal %u kB free (largest block %u kB), PSRAM %u kB free",
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024,
                   (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024,
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024);
  - interval: 1h                # "Made for ESPHome": check for a published
    startup_delay: 1h           # firmware update once an hour. Without the delay the
    then:                       # first run lands 0-5 s after boot, a third TLS session
      - lambda: |-              # beside the boot fetches (6a.2); on_boot does the first
          if (id(wifi_comp).is_connected()) tracker::upd::check_quiet("hourly");
  - interval: 1s                # UI-62: screen off after 1 min idle, after sunset
    then:
      - lambda: |-
          // Unknown time (no NTP yet) counts as DAY here: an offline boot must not put the screen
          // to sleep a minute later.
          const auto t = id(sntp_time).now();
          const bool night = t.is_valid() && tracker::sun::elevation((double) t.timestamp,
              (double) id(obs_lat).state, (double) id(obs_lon).state) < -0.833;   // standard sunset
          if (!(id(auto_off).state && night)) {
            // Sunrise, or the switch went off: never leave it dark. No touch woke it, so there is
            // none for the shield to eat.
            if (id(screen_asleep)) {
              id(screen_wake)->execute();
              lv_obj_add_flag(id(wake_shield), LV_OBJ_FLAG_HIDDEN);
            }
            return;
          }
          if (id(screen_asleep)) return;
          if (tracker::upd::ui_.root != nullptr) return;     // never blank an update in progress
          if (esphome::millis() - id(last_touch_ms) < 60000) return;
          id(screen_sleep)->execute();
  - interval: 30s               # UI-44 / UI-44c: auto-dim follows the Sun, and
    then:                       # Auto Off blanks the panel overnight.
      - lambda: |-
          const auto t = id(sntp_time).now();
          if (!t.is_valid()) return;
          if (id(screen_asleep)) return;   // UI-62: the shared pass would relight a screen we put out
          // UI-44: the position is read from the ENTITIES every pass, never cached - the
          // settings page, the web UI and Home Assistant can all change it.
          id(sun_elevation).publish_state(tracker::sun::elevation(
              (double) t.timestamp, (double) id(obs_lat).state, (double) id(obs_lon).state));
          tracker::display::g_state.window.enabled = false;   // Auto Off is sunset-sunrise (above), not hours
          tracker::display::Pass p;
          p.unix_s = t.timestamp;
          p.hour = t.hour;
          p.lat = id(obs_lat).state;
          p.lon = id(obs_lon).state;
          p.day = id(bright_day);
          p.auto_dim = id(auto_bright).state;
          p.settings_open = id(settings_page)->is_showing();   // UI-44: it would fight the slider
          p.now_ms = esphome::millis();
          tracker::display::pass(*id(backlight), p);
  - interval: 1s                # UI-67: About, refreshed each second while shown
    then:
      - lambda: |-
          if (!id(about_page)->is_showing()) return;
          char b[64];
          char built[16];
          tracker::about::tidy_date(__DATE__, built, sizeof(built));
          snprintf(b, sizeof(b), "ESPHome %s, built %s", ESPHOME_VERSION, built);
          lv_label_set_text(id(about_build), b);
          static char d[200];
          const std::string ip = id(ip_addr).state, ss = id(wifi_ssid_info).state;
          tracker::about::device_text(d, sizeof(d), App.get_name().c_str(), ip.c_str(), ss.c_str(),
                                      (int) id(wifi_comp).wifi_rssi(), get_mac_address_pretty().c_str(),
                                      esphome::millis() / 1000.0);
          lv_label_set_text(id(about_device), d);
  - interval: 2s                # decision 202: the three diagnostic text sensors had no publisher at all -
    then:                       # the debug page's Data section and their web UI rows were empty
      - lambda: |-
          const auto &a = f1::app::g;
          auto put = [](text_sensor::TextSensor *t, const char *v) {
            if (!t->has_state() || t->state != v) t->publish_state(v);
          };
          put(id(weekend_state), f1::state::weekend_name(a.st.weekend));
          put(id(order_mode), f1::state::order_name(a.st.order));
          put(id(calendar_source), a.cal.fetched ? "fetched" : "compiled");
  - interval: 1s                # UI-27: debug page, only while it is showing
    then:
      - lambda: |-
          if (!id(debug_page)->is_showing()) return;
          static char b[900];
          const uint32_t s = esphome::millis() / 1000;
          const std::string ip = id(ip_addr).state, ss = id(wifi_ssid_info).state;
          snprintf(b, sizeof(b),
                   "System\n  IP %s\n  Wi-Fi %s  %d dBm\n  Firmware %s  ESPHome %s\n"
                   "  Up %ud %02uh %02um\n  RAM %u kB  PSRAM %u kB free\n\n"
                   "Data\n  Calendar: %s\n  State: %s\n  Order: %s\n",
                   ip.empty() ? "-" : ip.c_str(), ss.empty() ? "-" : ss.c_str(),
                   (int) id(wifi_comp).wifi_rssi(), "${fw_version}", ESPHOME_VERSION,
                   (unsigned) (s / 86400), (unsigned) ((s % 86400) / 3600),
                   (unsigned) ((s % 3600) / 60),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   id(calendar_source).state.empty() ? "compiled" : id(calendar_source).state.c_str(),
                   id(weekend_state).state.empty() ? "-" : id(weekend_state).state.c_str(),
                   id(order_mode).state.empty() ? "-" : id(order_mode).state.c_str());
          lv_label_set_text(id(debug_label), b);
