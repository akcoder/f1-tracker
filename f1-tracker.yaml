    - id: settings_page         # UI-16 (section 7)
      skip: true
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_load:
        # 7 / decision 38: STAGED Save/Cancel. On-screen edits live in the LVGL
        # widgets and are written to entities only on Save; Cancel restores what
        # was captured here. Brightness is the deliberate exception below.
        - lambda: |-
            id(bright_on_open) = id(backlight).current_values.get_brightness();
            id(bright_day_open) = id(bright_day);
            auto set = [](lv_obj_t *o, bool on) {
              if (on) lv_obj_add_state(o, LV_STATE_CHECKED);
              else lv_obj_remove_state(o, LV_STATE_CHECKED);
            };
            set(id(sw_autodim), id(auto_dim).state);
            set(id(sw_alerts), id(watched_alerts).state);
            set(id(sw_milestone), id(milestone_only).state);
            lv_slider_set_value(id(sl_carousel), (int) id(carousel_secs).state, LV_ANIM_OFF);
            lv_slider_set_value(id(sl_bright),
                (int) roundf((id(auto_dim).state ? id(bright_day)
                                                 : id(bright_on_open)) * 100.0f), LV_ANIM_OFF);
            f1::ui::settings_labels(id(lbl_carousel), (int) id(carousel_secs).state);
      widgets:
        - label:
            x: 16
            y: 14
            text: "SETTINGS"
            text_font: mono16
            text_color: 0xFF8A1F
        - button:
            x: 238
            y: 8
            width: 110
            height: 38
            bg_color: 0x1A2547
            shadow_width: 0
            widgets:
              - label: {align: CENTER, text: "Cancel", text_font: mono16}
            on_click:
              # Cancel restores the brightness captured in on_load - the one
              # setting that was applied live.
              - lambda: id(bright_day) = id(bright_day_open);
              - light.turn_on:
                  id: backlight
                  brightness: !lambda return id(bright_on_open);
                  transition_length: 0s
              - lvgl.page.show: race_page
        - button:
            x: 356
            y: 8
            width: 110
            height: 38
            bg_color: 0x2D5BD0
            shadow_width: 0
            widgets:
              - label: {align: CENTER, text: "Save", text_font: mono16}
            on_click:
              # 7.1.2: every change routes through the ENTITIES, which are the
              # single source of truth. The widgets are one view of them.
              - lambda: |-
                  auto sw = [](lv_obj_t *o, switch_::Switch *e) {
                    if (lv_obj_has_state(o, LV_STATE_CHECKED)) e->turn_on(); else e->turn_off();
                  };
                  sw(id(sw_autodim), id(auto_dim));
                  sw(id(sw_alerts), id(watched_alerts));
                  sw(id(sw_milestone), id(milestone_only));
                  id(carousel_secs).make_call()
                      .set_value(lv_slider_get_value(id(sl_carousel))).perform();
              - lvgl.page.show: race_page

        - label: {x: 16, y: 66, text: "Auto-dim display", text_font: mono14, text_color: 0xC9D3F2}
        - switch: {id: sw_autodim, x: 380, y: 60, width: 72, height: 32}
        - label:
            x: 16
            y: 90
            width: 440
            text: "Latitude and longitude set sunrise/sunset for auto-dim only.\nThe time zone is fixed in firmware and does not follow them."
            text_font: mono12
            text_color: 0x7E8BB3

        - label: {x: 16, y: 136, text: "Brightness", text_font: mono14, text_color: 0xC9D3F2}
        - slider:
            id: sl_bright
            x: 150
            y: 138
            width: 300
            height: 18
            min_value: 1
            max_value: 100
            on_value:
              # The deliberate exception (decision 38): brightness is applied
              # LIVE so the change is visible, and Cancel restores it. The guard
              # against the light's own on_state echo is the comparison.
              - lambda: |-
                  float v = (float) x / 100.0f;
                  if (id(auto_dim).state) id(bright_day) = v;
                  if (fabsf(id(backlight).current_values.get_brightness() - v) < 0.005f) return;
                  auto call = id(backlight).turn_on();
                  call.set_brightness(v);
                  call.perform();

        - label: {x: 16, y: 180, text: "Carousel", text_font: mono14, text_color: 0xC9D3F2}
        - label: {id: lbl_carousel, x: 150, y: 180, text: "45 s", text_font: mono14, text_color: 0x7E8BB3}
        - slider:
            id: sl_carousel
            x: 230
            y: 182
            width: 220
            height: 18
            min_value: 15
            max_value: 120
            on_value:
              - lambda: f1::ui::settings_labels(id(lbl_carousel), (int) x);

        - label: {x: 16, y: 224, text: "Watched driver alerts", text_font: mono14, text_color: 0xC9D3F2}
        - switch: {id: sw_alerts, x: 380, y: 218, width: 72, height: 32}
        - label: {x: 16, y: 262, text: "Milestones only", text_font: mono14, text_color: 0xC9D3F2}
        - switch: {id: sw_milestone, x: 380, y: 256, width: 72, height: 32}

        - label:
            id: settings_note
            x: 16
            y: 310
            width: 448
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
        - label:
            align: BOTTOM_RIGHT
            x: -10
            y: -8
            text: "v${fw_version}"
            text_font: mono12
            text_color: 0x5A6687
    - id: debug_page            # UI-27: long-press the gear
      skip: true
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - label:
            x: 8
            y: 8
            text: "DEBUG"
            text_font: mono16
            text_color: 0xFF8A1F
        - label:
            id: debug_label
            x: 8
            y: 32
            width: 464
            text: ""
            text_font: mono12
            text_color: 0xC9D3F2
        - button:
            align: TOP_RIGHT
            x: -8
            y: 4
            width: 96
            height: 34
            bg_color: 0x1A2547
            shadow_width: 0
            widgets:
              - label: {align: CENTER, text: "Close", text_font: mono16}
            on_click:
              - lvgl.page.show: race_page

interval:
  - interval: 1s                # the application tick (f1_app.h). Everything on
    then:                       # screen is a function of ONE state (4.1), so this
      - lambda: |-              # is the only place that reads it and writes widgets.
          const auto t = id(sntp_time).now();
          f1::app::set_clock(t.is_valid() ? (uint32_t) t.timestamp : 0, t.is_valid());
          f1::app::tick(esphome::millis());
          if (t.is_valid()) {
            char b[12];
            // 6.7: 24 h local by default; the three-state dropdown lands at M5.
            snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            lv_label_set_text(id(race_clock), b);
          }
  - interval: 1s                # UI-27: debug page, only while it is showing
    then:
      - lambda: |-
          if (!id(debug_page)->is_showing()) return;
          static char b[900];
          const uint32_t s = esphome::millis() / 1000;
          const std::string ip = id(ip_addr).state, ss = id(wifi_ssid_info).state;
          snprintf(b, sizeof(b),
                   "SYSTEM\n  IP %s\n  Wi-Fi %s  %d dBm\n  Firmware %s  ESPHome %s\n"
                   "  Up %ud %02uh %02um\n  RAM %u kB  PSRAM %u kB free\n\n"
                   "DATA\n  Calendar: %s\n  State: %s\n  Order: %s\n",
                   ip.empty() ? "-" : ip.c_str(), ss.empty() ? "-" : ss.c_str(),
                   (int) id(wifi_comp).wifi_rssi(), "${fw_version}", ESPHOME_VERSION,
                   (unsigned) (s / 86400), (unsigned) ((s % 86400) / 3600),
                   (unsigned) ((s % 3600) / 60),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   id(calendar_source).state.empty() ? "compiled" : id(calendar_source).state.c_str(),
                   id(weekend_state).state.empty() ? "-" : id(weekend_state).state.c_str(),
                   id(order_mode).state.empty() ? "-" : id(order_mode).state.c_str());
          lv_label_set_text(id(debug_label), b);
